Mac yet. Install the 4.6 templates before the release check below.\n\n## Proposed fix\n\n1. **Debug builds only.** `CombatScene` creates CheatPanel only when `OS.is_debug_build()`. In CombatInputHandler, guard the toggle **and** the ESC branch (`_scene._cheat != null and ...`); the ESC read would crash on a null panel.\n2. **Drop the bare C binding** and keep F12. Update the \"[F12 / C]\" label (CheatPanel.gd:90) and the doc comment (CombatInputHandler.gd:459).\n3. **Decouple CombatScene from TestConfig before excluding anything.**\n   - Move the apply step into debug code: TestLaunchScene passes its overrides through `CombatConfig`, or TestConfig applies them through a hook it registers. CombatScene then has no `TestConfig.` references.\n   - Excluding `debug/*` while CombatScene still references it would fail to compile, or crash `_ready`, in release.\n4. **Take the TestConfig autoload out of release:**\n   - register it at runtime from debug code; or\n   - keep a no-op stub outside `debug/`.\n\n   Don't rely on feature-tag overrides for autoload entries; it's unverified that Godot honours them.\n5. **Make the `start_new_run` fallback debug-only.** In release, `_ready` returns before `setup_combat` (`current_enemy` may be null) and uses `call_deferred` to change scene to the main menu, with an error.\n6. **Export filter:** create a release preset with `exclude_filter=\"debug/*\"`, delete the `.gitignore` rule and commit the preset (see Decision). Document the preset in TESTING.md.\n7. **Optional:** mark a fight \"tainted\" when the cheat panel acts, so parity and replay tooling skip it.\n\n## Verification\n\n- **Release build.** This needs a release export template (`--export-release`): `is_debug_build()` is false only there, so `--no-debug` isn't a real test. Check:\n  - no cheat panel; C and F12 do nothing; ESC still works;\n  - TestConfig is absent;\n  - launching CombatScene directly returns to the menu.\n- **Editor / debug run:** F12 toggles the panel, and TestLaunchScene still applies its config.\n- `tools/run_checks.sh` green. The tests run on a debug binary and never touch `_cheat`, and LiveSmoke and Parity call `start_new_run` themselves.\n\n## Related\n\n- 047 needs an export check for the deck JSON; do it with the same preset.\n\n## Work log\n\n- 2026-09-25: opened from the architecture review. Verified the C/F12 binding at CombatInputHandler :468 and the unconditional CheatPanel creation at CombatScene :231.\n- 2026-09-30: re-verified at `3009a60` and rewritten.\n  - The panel also edits GameManager and the save, which makes this worse than first stated.\n  - TestConfig does nothing in normal play; the replay concern is the cheat panel's.\n  - Step 4 as written would crash release builds, so CombatScene is decoupled first.\n  - Added the ESC guard.\n  - Noted the deliberate `.gitignore` of export presets.\n  - `--no-debug` isn't a valid check.\n- 2026-09-30: owner decision: commit `export_presets.cfg` and remove the `.gitignore` rule. Export templates still need installing."}, {"id": "\"054\"", "title": "Fix CombatHandlers log-type constants (off by one vs CombatLog.LogType)", "status": "backlog", "area": "combat", "priority": "normal", "started": "", "finished": "", "file": "054-handler-log-type-constants.md", "body": "## Description\n\nFound in the 2026-09-25 architecture review (issue 8 of 9). Re-verified 2026-09-30 at `3009a60`. Line numbers are from that commit.\n\nDo this together with 055. Both edit the same lines of CombatHandlers.gd: :16-18, :156-174, and `_log` at :2301.\n\n`combat/events/CombatHandlers.gd:16-18`:\n```gdscript\n## Log-side constants matching CombatScene._LogType enum values.\nconst _LOG_PLAYER := 0\nconst _LOG_ENEMY  := 1\n```\n\n`CombatLog.LogType` is `{ TURN, PLAYER, ENEMY, DAMAGE, HEAL, TRAP, DEATH }` (CombatLog.gd:14), so TURN=0, PLAYER=1, ENEMY=2. `CombatScene._LogType` does exist (CombatScene.gd:1916, an alias of that enum); what's wrong is the constants' values, not the name in the comment.\n\nThe value reaches the screen unchanged:\n\n`CombatHandlers._log` (:2301-2302) → `CombatState._log` (:114-116, a `LOG` journal event carrying `log_type`) → CombatPresenter :684-686 → `CombatUI.on_state_combat_log` (:87-90) → `CombatLog.write` → `_color_for(type)` (:42-50)\n\nSo handler lines tagged `_LOG_PLAYER` render in the grey TURN colour, and `_LOG_ENEMY` lines in the blue PLAYER colour. Only the colour is affected. `CombatDiagnostics._print_log` ignores the type and `digest_text` excludes logs, so parity and balance are unaffected.\n\nAffected in CombatHandlers:\n- 19 `_LOG_PLAYER` and 42 `_LOG_ENEMY` uses;\n- 4 `side` values picked from the owner (:1389, :1426, :1506, :1543);\n- one inline conditional (:723);\n- `_log`'s default parameter (:2301).\n\nThe rest of the rules code is already correct:\n- HardcodedEffects.gd:21-24 has `_LOG_PLAYER=1`, `_LOG_ENEMY=2`, `_LOG_TRAP=5` and a `_log_side(owner)` helper (:29-30).\n- CombatState, RelicEffects (:159), PhaseTransition (:74) and CombatInputHandler (:457) pass correct bare integers.\n- EffectResolver, CombatManager, CombatSetup and the resolvers don't log.\n\n## Proposed fix\n\n1. **Use the enum.** Preferred: move `LogType` into `Enums.gd` and alias it in CombatLog. CombatLog is a UI node helper (its `setup` touches nodes), and rules code shouldn't depend on it. Otherwise, use `CombatLog.LogType.PLAYER` / `.ENEMY` directly.\n2. **Add a `_log_side(owner)` helper** to CombatHandlers, like HardcodedEffects', and use it wherever the handler knows the owner.\n3. **Replace the bare integers** in CombatState, RelicEffects, PhaseTransition and CombatInputHandler, and HardcodedEffects' constants, with the enum. Clean-up only; no behaviour change.\n4. **Fix the stale comments:** CombatLog.gd:5-10, CombatScene.gd:1913-1915, HardcodedEffects.gd:21.\n\n## Verification\n\n- Extend the Swarm Discipline test (TriggerHandlerTests.gd:666; the handler logs at CombatHandlers:167-170): the journal's `LOG` event has `log_type == PLAYER`. Add a check on one enemy-side handler log.\n- Visual: in a live fight, handler lines show the player and enemy colours.\n- `tools/run_checks.sh` green; Parity digests unchanged.\n\n## Work log\n\n- 2026-09-25: opened from the architecture review. Verified the constants against `CombatLog.LogType`.\n- 2026-09-30: re-verified at `3009a60` and rewritten.\n  - Traced the value end to end: the bug is real, and it affects colour only.\n  - `CombatScene._LogType` does exist.\n  - Other rules code is already correct, so step 3 is clean-up, not a bug hunt.\n  - Bundled with 055."}, {"id": "\"055\"", "title": "Remove the GameManager read from CombatHandlers; fix stale Phase-4 comments", "status": "backlog", "area": "combat", "priority": "normal", "started": "", "finished": "", "file": "055-rules-code-gamemanager-leak-stale-comments.md", "body": "## Description\n\nFound in the 2026-09-25 architecture review (issue 9 of 9). Re-verified 2026-09-30 at `3009a60`. Line numbers are from that commit.\n\nDo this together with 054. Both edit the same lines of CombatHandlers.gd, and the log lines at :160 and :174 use the `_LOG_PLAYER` constant that 054 replaces.\n\n1. **Rules code reads an autoload.**\n   - `CombatHandlers.gd:159`, in `on_summon_passive_void_imp_boost`, does `var hero := HeroDatabase.get_hero(GameManager.current_hero)`. It is used only for the hero name in the log line at :160.\n   - In the sim and the tests it names whatever hero the autoload holds.\n   - This is the only code hit: grepping `GameManager.`, `UserProfile.` and `TestConfig.` over lint's `RULES_FILES` (plus RelicRuntime and BuffSystem) finds only comments otherwise. `PhaseTransition.gd:70`'s `EncounterDecks.get_deck` reads static data, not run state.\n   - `state.player_hero_id` exists (CombatState.gd:1655) and `setup_combat` sets it (:2335).\n   - The handler runs only on ON_PLAYER_MINION_SUMMONED (CombatSetup:251-252), and the state has no enemy hero id. So \"the hero for `ctx.owner`\" isn't possible; use `state.player_hero_id`.\n2. **Hardcoded side.** `on_ritual_fired_ritual_surge(_ctx)` (:172-173) calls `state._summon_token(\"void_imp\", \"player\")`.\n   - ON_RITUAL_FIRED is only fired with owner \"player\" (CombatState:896, CombatHandlers:380; Enums.gd:99), and no enemy passive is \"ritual_surge\".\n   - So this is an invariant clean-up with no behaviour change.\n3. **Stale comments** describing the flow before Phase 4:\n   - CombatState.gd:\n     - :215-217, on `_has_talent`: \"...populates `talents` from GameManager.unlocked_talents in CombatScene._ready\";\n     - :1644-1646 (`talents`), :1650 (`hero_passives`), :1653-1654 (`player_hero_id`, \"Sim-only today\").\n   - VfxController.gd:145: \"P4B: scene's wrapper mutates state …\".\n   - EffectStep.gd: :18 (`scene._armour_doubled_on_knight`), :44 (`scene._add_kill_stacks`), :47 (`scene._spell_cancelled`), :50 (`scene._void_mana_drain_pending`). All of these now live on CombatState.\n   - CombatUI.gd: the section header at :32 and every \"Subscriber to CombatState.…\" header (:36, :51, :85, :92, :102, :112, :118, :124). The presenter calls these methods; nothing subscribes.\n   - ARCHITECTURE.md:21 (\"Signal X → refresh UI Y\") and :319 (\"L1–L9\"; it is L1–L11 now, more after 050 and 051).\n   - RelicRuntime.gd:5 (\"from GameManager.player_relics\") and CombatScene.gd:170.\n## Out of scope (owner, 2026-09-30)\n\nAbout 7 combat UI files read hero / talent info from `GameManager` instead of `state` or the `CombatConfig`:\n- PipBar.gd:194-198\n- SerisResourceBar.gd:47-48\n- CombatUiStyle.gd:32, :173, :206, :214\n- PlayerHeroPanel.gd:64, :98\n- EnemyHeroPanel.gd:86, :179-181\n- BoardSlot.gd:547\n\nIn normal play they show the same values, so they are left out of this task. They are recorded under roadmap item C5 (`ARCHITECTURE_ROADMAP.md`), for task 056 to groom.\n\n## Proposed fix\n\n1. Use `HeroDatabase.get_hero(state.player_hero_id)`.\n2. Rename `_ctx` → `ctx` and call `state._summon_token(\"void_imp\", ctx.owner)`.\n3. Rewrite the stale comments to describe the current flow: `CombatConfig` → `setup_combat`, and presenter → CombatUI.\n4. **Lint:** extend L1's rules-code scan with the regex `(?<![\\w.])(GameManager|UserProfile|TestConfig)\\.`.\n   - L1 lives in `tools/lint/lint_engine.py`: `RULES_FILES` is at :89-102, and `scan_shell` (:215-222) already strips comments.\n   - CombatConfig.gd reads GameManager by design (`from_game_manager`, :40-67) and stays outside `RULES_FILES`.\n\n## Verification\n\n- The new lint passes, with zero hits in rules code.\n- `tools/run_checks.sh` green. The handler-order snapshot is unchanged, since no registrations change.\n\n## Work log\n\n- 2026-09-25: opened from the architecture review. Verified the GameManager read at CombatHandlers :159 and the stale comments at CombatState :215-217 / :1645-1654.\n- 2026-09-30: re-verified at `3009a60` and rewritten.\n  - \"Hero for `ctx.owner`\" isn't buildable, so use `state.player_hero_id`.\n  - The Ritual Surge hardcode is style, not a bug.\n  - Corrected line numbers and added the missed stale comments (EffectStep:18, the CombatUI headers, ARCHITECTURE.md:21/:319, RelicRuntime:5).\n  - Listed the other UI GameManager readers as an open scope decision.\n  - Bundled with 054.\n- 2026-09-30: owner decision: the UI readers are out of scope, moved to roadmap C5."}, {"id": "\"056\"", "title": "Groom the architecture roadmap into tasks", "status": "backlog", "area": "architecture", "priority": "normal", "started": "", "finished": "", "file": "056-groom-architecture-roadmap.md", "body": "## Description\n\nReview `design/refactors/ARCHITECTURE_ROADMAP.md` (the longer-term structural items from the 2026-09-25 architecture review, workstreams A–J) and turn it into concrete, sized backlog tasks. The doc is **ungroomed**: most of its evidence comes from review agents and has not been re-checked by hand. Only items marked **(verified)** were.\n\nWhoever picks this up should run it as a **recurring grooming task**. Each pass grooms part of the doc, logs the result in the doc's section 13 (grooming log), and leaves this task open (or opens a fresh grooming task) until every workstream is filed or dropped.\n\nWhen to run a pass:\n- after tasks 047–055 land (they change some of the evidence: leaks, statics, side bugs, save format),\n- before designing the next hero or faction (workstreams C and D decide how cheap that is),\n- whenever the roadmap is more than about a month stale.\n\n## Procedure (per pass)\n\n1. **Re-verify.** For each item being groomed, check the evidence against the current code: the quoted code, the counts and whether the problem still exists. Mark it **(verified <date>)** in the doc, or strike it with a note if it's gone.\n2. **Owner decisions.** Bring the relevant questions from the doc's section 12 (Q1–Q8) to the owner. Record the answers in the doc. Don't file tasks whose scope depends on an unanswered question; file the audit or decision task instead (e.g. A0).\n3. **Split.** Turn each candidate task (A0, A1, …, J6) that's ready into a backlog task with `/task-start`, or write the file directly with `status: backlog` if not starting it now. Each task needs:\n   - problem, evidence (file:line, quoted code), consequence,\n   - proposed fix steps,\n   - verification: `tools/run_checks.sh` green, and Parity byte-identical or a recorded BalanceSimBatch delta,\n   - dependencies on other task ids.\n   Keep the doc's size labels (S/M/L) as a guide; split anything L into phases, like LIVE_SIM_UNIFICATION_PLAN did.\n4. **Straight-to-task bugs.** Items the doc flags as probable bugs should become their own small tasks immediately once verified:\n   - E1: rune placement VFX hits the wrong slot; `on_state_void_marks_changed` pushes live enemy HP.\n   - I7: the deathless-save label stays ≤0; the champion log message is hardcoded.\n   - Section A's enemy-side turn-start effects, if A0 confirms them as bugs.\n   - The `PhaseTransition` trap/env cleanup concern, if task 050 didn't already settle it.\n5. **Update the doc.** In each groomed item write \"→ task NNN\", add a row to the grooming log (date, items re-verified, tasks created, items dropped), and bump the doc's status line.\n6. **Keep ARCHITECTURE.md honest.** Invariant #2 (\"symmetric handlers\") overstates the current code. Once A0 exists, either add a caveat pointing to the audit or tighten the wording.\n\n## Suggested first pass\n\n- Re-verify and file **D1** (content-lint test), **C1** (BranchData + `active_pools()`), **A0** (symmetry audit), **I2** (statics per state) and **J1** (test auto-discovery + auto-teardown). They're cheap, have few dependencies and make everything after them safer.\n- Ask the owner Q1, Q2, Q5 and Q7.\n\n## Done when\n\nEvery item in workstreams A–J is either linked to a task, explicitly dropped with a reason, or deferred behind a named owner decision. The doc's grooming log records it.\n\n## Work log\n\n- 2026-09-25: opened alongside `design/refactors/ARCHITECTURE_ROADMAP.md`. Short-term fixes from the same review are tasks 047–055."}];
const STATE = { status: "active", area: "", q: "" };

// Tiny markdown renderer — handles headers, bold, italic, code, lists, links, paragraphs.
function md(src) {
  src = src.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // fenced code
  src = src.replace(/```([\s\S]*?)```/g, (_, c) => "<pre><code>" + c.replace(/^\n/, "") + "</code></pre>");
  const lines = src.split("\n");
  const out = [];
  let inList = null; // "ul" | "ol" | null
  let para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + para.join(" ") + "</p>"); para = []; } };
  const closeList = () => { if (inList) { out.push("</" + inList + ">"); inList = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    if (!line.trim()) { flushPara(); closeList(); continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) {
      flushPara(); closeList();
      out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">");
    } else if ((m = line.match(/^[-*]\s+(.*)$/))) {
      flushPara();
      if (inList !== "ul") { closeList(); out.push("<ul>"); inList = "ul"; }
      out.push("<li>" + inline(m[1]) + "</li>");
    } else if ((m = line.match(/^\d+\.\s+(.*)$/))) {
      flushPara();
      if (inList !== "ol") { closeList(); out.push("<ol>"); inList = "ol"; }
      out.push("<li>" + inline(m[1]) + "</li>");
    } else if (line.startsWith("<pre>")) {
      flushPara(); closeList(); out.push(line);
    } else {
      closeList();
      para.push(inline(line));
    }
  }
  flushPara(); closeList();
  return out.join("\n");
}
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function populateAreas() {
  const sel = document.getElementById("area");
  const areas = [...new Set(TASKS.map(t => t.area).filter(Boolean))].sort();
  for (const a of areas) {
    const o = document.createElement("option"); o.value = a; o.textContent = a;
    sel.appendChild(o);
  }
}

function render() {
  const list = document.getElementById("list");
  const q = STATE.q.toLowerCase();
  let items = TASKS.filter(t => {
    if (STATE.status !== "all" && t.status !== STATE.status) return false;
    if (STATE.area && t.area !== STATE.area) return false;
    if (q && !(t.title.toLowerCase().includes(q) || t.body.toLowerCase().includes(q))) return false;
    return true;
  });
  // sort: done by finished desc; else started desc; fallback id desc
  items.sort((a, b) => {
    const ka = a.status === "done" ? a.finished : a.started;
    const kb = b.status === "done" ? b.finished : b.started;
    return (kb || "").localeCompare(ka || "") || (b.id || "").localeCompare(a.id || "");
  });
  document.getElementById("count").textContent = items.length + " task" + (items.length === 1 ? "" : "s");
  if (!items.length) { list.innerHTML = '<div class="empty">No tasks match.</div>'; return; }
  list.innerHTML = items.map(t => {
    const dates = t.status === "done" && t.finished
      ? t.finished
      : (t.started || "");
    return `
      <div class="task" data-id="${t.id}">
        <div class="task-head">
          <span class="id">${t.id}</span>
          <span class="title">${escapeHtml(t.title)}</span>
          ${t.area ? `<span class="pill">${escapeHtml(t.area)}</span>` : ""}
          <span class="pill status-${t.status}">${t.status}</span>
          <span class="dates">${dates}</span>
        </div>
        <div class="body">${md(t.body || "_(no body)_")}</div>
      </div>`;
  }).join("");
  for (const head of list.querySelectorAll(".task-head")) {
    head.addEventListener("click", () => head.nextElementSibling.classList.toggle("on"));
  }
}
function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

document.getElementById("q").addEventListener("input", e => { STATE.q = e.target.value; render(); });
document.getElementById("area").addEventListener("change", e => { STATE.area = e.target.value; render(); });
for (const tab of document.querySelectorAll(".tab")) {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));
    tab.classList.add("on");
    STATE.status = tab.dataset.status;
    render();
  });
}
populateAreas();
render();
</script>
