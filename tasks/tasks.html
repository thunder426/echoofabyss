ual-tag-Formation ruling), `runic_substitution` (1M spell, destroy targeted Rune, place random basic Rune, triggers redesigned T1), `runic_blast` (existing `vael_rune_master` card — **dual-pool** only; add `\"korrath_runic_knight\"` to its pool tag in the dict), `runic_apparition` (3M spell, conditional Knight summon with SWIFT and −200/−200 stat override), `rune_conclave` (4E dual-tag minion 200/500, ON PLAY places 2 random Runes). Reward eligibility checks pool tag + `runeforge_strike` in active talents. Depends on task 022 (T1 redesign) being implemented first so Substitution's destruction correctly feeds absorption.\n\nEngine prerequisites:\n- Targeted-Rune spell flow (Substitution needs to let the player pick a friendly Rune — existing spells target minions/heroes, not runes). May require a new target type or UI flow.\n- Runtime stat-override at summon time (Runic Apparition's −200/−200) that composes with talent_overrides on the Knight.\n- Dual-tag Formation behavior matches §13 ruling notes: pair-keyed-on-partner means a flanked dual-tag minion fires Formation twice. May also affect Squire of the Order (`korrath_core`) and Battle Drillmaster cascade (`korrath_common`) — audit those alongside.\n\n## Work log\n\n- 2026-05-12: opened.\n\n## Summary\n\n_(filled in at /task-done)_"}, {"id": "\"027\"", "title": "Implement korrath_abyssal_breaker cards in CardDatabase", "status": "backlog", "area": "content", "priority": "normal", "started": "", "finished": "", "file": "027-implement-korrath-abyssal-breaker-cards.md", "body": "## Description\n\nImplement the 7 cards + 1 token designed in `design/KORRATH_HERO_DESIGN` §14 into `cards/data/CardDatabase.gd` and add `korrath_abyssal_breaker` to `_card_pools` with talent gating on `corrupting_presence` (B3 T0). Cards: `shatterclaw_fiend` (3E Demon, on-attack 100 AB residual via `ON_PLAYER_ATTACK_POST` per task 021), `font_of_the_depths` (existing card — **triple-pool**; add `\"korrath_abyssal_breaker\"` to its existing `[\"vael_piercing_void\", \"seris_corruption_engine\"]` tag), `decree_of_ruin` (3M spell, consume hero AB and deal 700 + consumed-AB VOID_CORRUPTION to hero), `tide_of_corruption` (3M spell, summon 200/200 Corruption Spawn per corrupted enemy minion), `abyssal_sentence` (4M spell, destroy enemy minion + 1 Corruption to enemy hero), `herald_of_decay` (3E Demon, on-play and turn-start hero corruption +1/turn), `maw_of_the_abyss` (6E Demon, AoE 2 Corruption on play + per-attack AB residual). Token: `corruption_spawn` (200/200 Demon, vanilla). Reward eligibility checks pool tag + `corrupting_presence` in active talents.\n\nEngine prerequisites (new effect-step patterns this task introduces):\n- `CONSUME_HERO_AB` (or generalized `CONSUME_HERO_BUFF`) effect step — reads the hero's AB total, removes all of it, exposes the value for the following damage step.\n- Damage step that reads the consumed-buff value from EffectContext and adds it to base damage. Required for Decree of Ruin's \"700 + consumed AB\" math; Path of Corruption amp applies to the combined total.\n- Hero-corruption support (already exists from task 016 PR3) — Herald's recurring effect and Sentence's rider both route through `state.apply_hero_buff(\"enemy\", BuffType.CORRUPTION, 100, ...)`.\n- Counting helper for Tide: `enemy_minions_with_corruption_count()` reading `BuffSystem.count_type(minion, BuffType.CORRUPTION) >= 1`.\n\nAdd probes in `TriggerHandlerTests.gd` and `CardEffectTests.gd` for every card; especially verify Decree's AB-consumption math (basic case, 0 AB, with Path of Corruption amp, with negative pre-existing AB clamped to 0) and Tide's empty-slot fill behavior.\n\n## Work log\n\n- 2026-05-12: opened.\n\n## Summary\n\n_(filled in at /task-done)_"}, {"id": "\"028\"", "title": "Art pass — korrath_core", "status": "backlog", "area": "art", "priority": "normal", "started": "", "finished": "", "file": "028-art-pass-korrath-core.md", "body": "## Description\n\nGenerate and wire art for the `korrath_core` pool cards (designed in §10). Five deck-buildable cards need card-face art; three of them are minions and also need battlefield art. Tokens (Order Footman, Rank-and-File ×2) are vanilla but still need card-face art so they render properly when added to hand or summoned.\n\nCards needing art:\n- `squire_of_the_order` — Human/Demon FORMATION minion. Card art + battlefield art.\n- `order_conscript` — Human minion. Card art + battlefield art.\n- `rally_the_ranks` — Spell. Card art only.\n- `quartermaster` — Human minion. Card art + battlefield art.\n- `shatterstrike` — Spell. Card art only.\n\nTokens:\n- `order_footman` — Human, card-face only (hand display).\n- `rank_and_file_h` — Human, card-face only (summon flash).\n- `rank_and_file_d` — Demon, card-face only (summon flash).\n\nWorkflow: use the `missing-art` skill to scan for gaps, then `add-art` to wire each PNG. Art style follows `design/master_doc/CARD_FRAME_DESIGN_REGULATION.md`. Order pool flavor is \"imperial dark knight order\" — disciplined humans-and-demons in armor, Korrath's banner motif.\n\n## Work log\n\n- 2026-05-12: opened.\n\n## Summary\n\n_(filled in at /task-done)_"}, {"id": "\"029\"", "title": "Art pass — korrath_common", "status": "backlog", "area": "art", "priority": "normal", "started": "", "finished": "", "file": "029-art-pass-korrath-common.md", "body": "## Description\n\nGenerate and wire art for the 9 cards in `korrath_common` (designed in §11). Mix of minions (need card + battlefield art) and spells (card only).\n\nMinions (card + battlefield):\n- `armoured_recruit` — Human, plate-armoured.\n- `shield_bearer` — Human with tower shield, FORMATION-flavored.\n- `bonebreaker` — Demon, brutal armour-cracker.\n- `battle_drillmaster` — Human/Demon dual-tag, commander figure.\n- `rank_breaker` — Demon, fast and savage.\n\nSpells (card only):\n- `shattering_volley` — physical/AB AoE motif.\n- `creeping_blight` — VOID_CORRUPTION single-target, dark green/purple.\n- `banner_of_the_order` — banner-raising, dual-race buff motif.\n\nRune (card only):\n- `bastion_rune` — Armour-themed rune. Should visually distinguish from existing Abyss Order Runes (Void/Blood/Dominion/Shadow) since Bastion is a Korrath-specific addition; consider a shield-engraved glyph in the rune frame.\n\nWorkflow: use `missing-art` to scan for gaps, then `add-art` to wire each PNG. Style follows `CARD_FRAME_DESIGN_REGULATION.md`. Pool flavor is Korrath's broad mechanic kit — Armour, Armour Break, Formation — without leaning into a single branch.\n\n## Work log\n\n- 2026-05-12: opened.\n\n## Summary\n\n_(filled in at /task-done)_"}, {"id": "\"030\"", "title": "Art pass — korrath_iron_vanguard", "status": "backlog", "area": "art", "priority": "normal", "started": "", "finished": "", "file": "030-art-pass-korrath-iron-vanguard.md", "body": "## Description\n\nGenerate and wire art for the 5 cards + 1 token in `korrath_iron_vanguard` (designed in §12). Iron Vanguard's visual identity is heavy plate armour, disciplined human formations, banners-and-pikes Roman-style legion aesthetic.\n\nMinions (card + battlefield):\n- `shield_squire` — young Human with oversized shield.\n- `vanguard_marshal` — Human commander, scroll/banner motif for the card-draw flavor.\n- `lord_commander` — Human, regal full-plate, projection-of-authority pose. Should feel like a hero-armour-granting figure.\n\nSpells (card only):\n- `shield_bash` — concussive shield-strike motif, scales-with-Armour visual cue.\n- `oath_of_iron` — ritual oath being sworn, Footmen materializing in the background.\n\nToken (card-face only):\n- `iron_footman` — distinct from Order Footman (core pool's token). Iron Footman is 200/200 vs Order Footman's 100/200 — visually depict heavier armour to signal the stat difference.\n\nWorkflow: use `missing-art` then `add-art`. Style per `CARD_FRAME_DESIGN_REGULATION.md`.\n\n## Work log\n\n- 2026-05-12: opened.\n\n## Summary\n\n_(filled in at /task-done)_"}, {"id": "\"031\"", "title": "Art pass — korrath_runic_knight", "status": "backlog", "area": "art", "priority": "normal", "started": "", "finished": "", "file": "031-art-pass-korrath-runic-knight.md", "body": "## Description\n\nGenerate and wire art for the 4 net-new cards in `korrath_runic_knight` (designed in §13). Runic Knight's visual identity is glowing rune-etched armour and weapons, chaotic-magic energy, dual-tag Human/Demon hybrid silhouettes. `runic_blast` is excluded — it's the existing `vael_rune_master` card (dual-pool only, art already wired).\n\nMinions (card + battlefield):\n- `runebound_initiate` — dual-tag Human/Demon FORMATION minion. Should visually carry both Human and Demon traits (split silhouette, or robed figure with corruption-marks).\n- `rune_conclave` — dual-tag Human/Demon 200/500 Epic body. The pool's centerpiece minion; should feel ritual-conclave / coven-of-runesmiths.\n\nSpells (card only):\n- `runic_substitution` — rune-being-shattered-and-replaced motif. Player-targeting visual.\n- `runic_apparition` — ghost-Knight materializing from runic energy. Should visually echo the Abyssal Knight base art but spectral/translucent to telegraph the −200/−200 stat profile.\n\nWorkflow: use `missing-art` then `add-art`. Style per `CARD_FRAME_DESIGN_REGULATION.md`. Note the dual-tag minions should follow whatever Squire of the Order (`korrath_core`) establishes for dual-tag silhouette convention.\n\n## Work log\n\n- 2026-05-12: opened.\n\n## Summary\n\n_(filled in at /task-done)_"}, {"id": "\"032\"", "title": "Art pass — korrath_abyssal_breaker", "status": "backlog", "area": "art", "priority": "normal", "started": "", "finished": "", "file": "032-art-pass-korrath-abyssal-breaker.md", "body": "## Description\n\nGenerate and wire art for the 6 net-new cards + 1 token in `korrath_abyssal_breaker` (designed in §14). Abyssal Breaker's visual identity is corruption-saturated demonic horror, sickly green-purple VOID_CORRUPTION palette, body-horror Demon designs. `font_of_the_depths` is excluded — it's the existing card (triple-pool only, art already wired).\n\nMinions (card + battlefield):\n- `shatterclaw_fiend` — Demon with shattering oversized claws, per-attack-AB visual cue.\n- `herald_of_decay` — gaunt Demon herald spreading corruption-plague aura outward.\n- `maw_of_the_abyss` — Epic 6E 500/600 Demon body. Pool's marquee card; should feel like a horror finisher.\n\nSpells (card only):\n- `decree_of_ruin` — judgement / ruin motif, VOID_CORRUPTION green-purple energy striking enemy hero. Visually evocative of consumption-conversion (AB consumed → damage).\n- `tide_of_corruption` — wave of corruption-spawn demons rising from corrupted enemies.\n- `abyssal_sentence` — execution/verdict motif on enemy minion + corruption tendril reaching toward enemy hero.\n\nToken (card-face only):\n- `corruption_spawn` — 200/200 Demon spawn, generic but distinctly corruption-flavored (matches Tide of Corruption's summon flash).\n\nWorkflow: use `missing-art` then `add-art`. Style per `CARD_FRAME_DESIGN_REGULATION.md`. Coordinate with `task-009` (already-implemented Korrath Branch 3 talents) — visual continuity with `corrupting_presence` / `corrupting_strike` / `path_of_corruption` talent icons.\n\n## Work log\n\n- 2026-05-12: opened.\n\n## Summary\n\n_(filled in at /task-done)_"}, {"id": "\"033\"", "title": "Audit description style for all new Korrath cards", "status": "backlog", "area": "content", "priority": "normal", "started": "", "finished": "", "file": "033-audit-korrath-card-descriptions.md", "body": "## Description\n\nAfter implementation tasks 023–027 ship, audit every new Korrath card's in-game description text against `design/master_doc/CARD_DESCRIPTION_STYLE.md`. Scope: all cards from `korrath_core`, `korrath_common`, `korrath_iron_vanguard`, `korrath_runic_knight`, and `korrath_abyssal_breaker` (≈31 cards). Existing cards in those pools that are dual/triple-pooled (Runic Blast, Font of the Depths) are out of scope — their descriptions were written by their original pools.\n\nAudit checklist per card:\n- Description uses the standard keyword casing (FORMATION, GUARD, SWIFT, ON PLAY, ON DEATH, ON LEAVE, ON ATTACK, etc.) per the style guide.\n- Numeric values are bare integers, not spelled out (100, not \"one hundred\").\n- Trigger timing language is consistent (\"ON PLAY:\", \"FORMATION:\", \"Whenever ...\", \"At the start of your turn:\", etc.).\n- Damage school is named where relevant (VOID_CORRUPTION, PHYSICAL) so the player knows which Armour interaction applies.\n- Card text is parseable without referring to the design doc — any non-obvious interaction (Banner's per-minion rider scope, Drillmaster's adjacency bypass, Shield Bash's Armour-sum-not-spent rule, Decree's AB-consumption-then-damage order) is either clear from the text or accompanied by a UI tooltip.\n- Cards that introduce or reference new mechanics (hero Armour, negative Armour, post-damage AB residual, AB consumption, rider-vs-aura) have description language consistent with the §2 / §6 / §11 ruling notes in the design doc.\n\nOutput: a punch list of cards-with-issues + suggested rewrites. Apply the rewrites in the same task.\n\n## Work log\n\n- 2026-05-12: opened.\n\n## Summary\n\n_(filled in at /task-done)_"}, {"id": "\"034\"", "title": "Fix the 3 KNOWN BUG test failures", "status": "done", "area": "combat", "priority": "normal", "started": "2026-05-13", "finished": "2026-05-13", "file": "034-fix-known-bug-test-failures.md", "body": "## Description\n\nThree tests in the test suite have been intentionally failing since they were written, each labeled `KNOWN BUG` in-test. Each represents a real symmetric-handling gap in the combat code — a player-side effect that has no enemy-side mirror, or an enemy-passive whose state flag is never set. Resolving them gets the suite to 100% green and closes long-standing parity holes.\n\nThe 3 failures:\n\n1. **`fiendish_pact / enemy cast arms discount on enemy side`** — [debug/tests/CardEffectTests.gd:191](debug/tests/CardEffectTests.gd#L191). `HardcodedEffects._fiendish_pact` early-returns when `ctx.owner != \"player\"`, so an enemy-cast Fiendish Pact arms no discount on the enemy side. **Fix:** add a symmetric enemy-side field (`_enemy_fiendish_pact_pending` or similar) and mirror the discount-on-next-Demon logic for the enemy. Confirm the cost-display hint on Demons in enemy hand updates too.\n\n2. **`void_rift_lord / player cast drains enemy mana next turn`** — [debug/tests/CardEffectTests.gd:455](debug/tests/CardEffectTests.gd#L455). The player-cast path for `void_rift_lord`'s mana-drain effect has no enemy-side flag, so the drain never lands. **Fix:** add a symmetric enemy-side mana-drain flag and the start-of-turn handler that consumes it. Same pattern as the existing player-side drain.\n\n3. **`champion_vch / 3 crit-kills summon champion (flag not set)`** — [debug/tests/TriggerHandlerTests.gd:1676](debug/tests/TriggerHandlerTests.gd#L1676). `_summon_enemy_champion`'s match block in `combat/events/CombatHandlers.gd` (lines ~1634-1660) is missing the `\"champion_void_champion\"` case, so `_champion_vch_summoned` never flips to true after summoning. The Void Champion minion is still placed on the board (the aura works by accident via enemy_board scan), but re-summon guards never engage. **Fix:** add `\"champion_void_champion\": _scene.set(\"_champion_vch_summoned\", true)` to the match (per the in-test fix hint at TriggerHandlerTests.gd:1682).\n\nVerification: after each fix, run `godot --headless --path . res://debug/tests/RunAllTests.tscn` and confirm the relevant test now passes without breaking any other test. Final state should be a fully green suite.\n\n## Work log\n\n- 2026-05-12: opened.\n- 2026-05-13: closed all 3 KNOWN BUG gaps; suite now 681/681 green.\n\n## Summary\n\nClosed the three symmetric-handling gaps that had lived as `KNOWN BUG` probes:\n\n1. **champion_void_champion summon flag** — added the missing `\"champion_void_champion\": _scene.set(\"_champion_vch_summoned\", true)` case to `_summon_enemy_champion`'s match block in [combat/events/CombatHandlers.gd](combat/events/CombatHandlers.gd). One-line fix; re-summon guards now engage correctly.\n\n2. **fiendish_pact enemy-side parity** — added `_enemy_fiendish_pact_pending: int` to [CombatState.gd](combat/board/CombatState.gd), removed the player-only early-return in `HardcodedEffects._fiendish_pact`, and now branch by `ctx.owner` to set the right field. Mirrored the display-only `essence_delta` hint for enemy-hand Demons; player-only `_refresh_hand_spell_costs` stays gated. Cleared at enemy turn start in both [CombatScene.gd](combat/board/CombatScene.gd) and [SimState.gd](sim/SimState.gd). The Seris-Demon-discount consumption pipeline through enemy AI is not wired (enemy AI doesn't currently cast Fiendish Pact in production); the field is set and observable, matching the test contract.\n\n3. **void_rift_lord enemy-side mana drain** — added `_enemy_void_mana_drain_pending: bool` to [CombatState.gd](combat/board/CombatState.gd). `EffectResolver.QUEUE_OPPONENT_MANA_DRAIN_NEXT_TURN` now sets the correct side based on `_opponent_of(ctx.owner)`. Consumed in [EnemyAI.run_turn](combat/board/EnemyAI.gd) after the mana refill, and in `SimState.begin_enemy_turn` for sim parity.\n\nTest updates: dropped the `(KNOWN BUG)` markers and the `assert_true(false)` placeholders in [CardEffectTests.gd](debug/tests/CardEffectTests.gd) and [TriggerHandlerTests.gd](debug/tests/TriggerHandlerTests.gd), replacing them with real assertions on the new fields. Also updated [design/TESTING.md](design/TESTING.md) to drop the \"7 KNOWN BUG failures are baseline\" guidance and switch the CI gate to assert exit 0.\n\nFull RunAllTests: **681 passed, 0 failed**."}, {"id": "\"035\"", "title": "Refactor Armour/AB damage math to a single signed net_armour value", "status": "done", "area": "combat", "priority": "normal", "started": "2026-05-16", "finished": "2026-05-16", "file": "035-refactor-armour-ab-to-signed-net.md", "body": "## Description\n\nCollapse the two-bucket Armour / Armour Break damage model in CombatManager into a single derived signed `net_armour = armour - sum(ARMOUR_BREAK)`. Positive net reduces incoming damage (capped so armour never reduces a hit below its raw value; 100 floor only when net actually reduced damage); negative net adds as flat bonus damage; zero passes raw through. Storage stays split (stat + buff stacks) so card triggers can still distinguish \"apply Armour\" from \"apply AB\" events. Wire damage math, Shield Bash, Decree of Ruin, and design doc §2 to the unified model. Minion status bar already renders the signed net via BoardSlot — confirm hero panels match, add probes for the small-damage-vs-armour case that currently inflates 50 ATK to 100.\n\n## Work log\n\n- 2026-05-16: opened.\n- 2026-05-16: closed.\n\n## Summary\n\nCollapsed Armour / Armour Break damage math into a unified signed-net model. Added `BuffSystem.net_armour(target)` helper; rewrote `CombatManager._apply_armour_math` to use `net = armour - sum(AB)` with three branches (positive net reduces damage but never below raw; negative net adds |net| as flat bonus; zero passes raw). Fixed a real bug: 50 ATK vs 200 Armour previously dealt 100 (floor inflated below-raw damage), now correctly deals 50. The 100 floor only applies when armour math reduces damage *above* the raw hit. Storage stays split (armour stat + ARMOUR_BREAK buff stacks) so card triggers can distinguish \"apply Armour\" vs \"apply AB\" events. Updated BoardSlot status bar to use the helper, added 4 new test probes (all 686 tests pass, +4 from 682), and rewrote design/KORRATH_HERO_DESIGN §2 with a worked-examples table and the canonical engine formula. Hero panels and minion status bar already render the signed-net display correctly."}, {"id": "\"036\"", "title": "Convert Formation from per-pair to one-shot consumable status", "status": "done", "area": "combat", "priority": "normal", "started": "2026-05-16", "finished": "2026-05-16", "file": "036-formation-one-shot-consumable.md", "body": "## Description\n\nReplace the existing pair-keyed Formation engine (`MinionInstance.formation_partners` dict, fires once per (actor, partner) pair) with a one-shot consumable model: Formation fires at most once per minion's lifetime — the first time a valid same-race adjacent partner is on board, it fires and the FORMATION status is consumed. Subsequent partners do nothing. Replace the dict with a single `formation_fired: bool`, update the handler to gate on it, hide the FORMATION keyword chip on the battlefield minion frame once consumed (big-card review view stays as-is), revise design doc §2 and the §10/§11/§12/§13 ruling-notes that currently lean on the per-pair model (Squire of the Order, Battle Drillmaster, Runebound Initiate dual-tag-flanked-twice ruling, Vanguard Marshal balance flag), and audit/extend the existing Formation tests for the new semantics.\n\n## Work log\n\n- 2026-05-16: opened.\n- 2026-05-16: closed.\n\n## Summary\n\nConverted Formation from per-pair memory (`MinionInstance.formation_partners: Dictionary`) to a one-shot consumable flag (`formation_fired: bool`). Once a FORMATION minion fires its effect for the first time, the status is consumed for the rest of that minion's lifetime — subsequent same-race partners coming and going cannot retrigger. Updated `_try_fire_formation` in CombatHandlers.gd to gate on the flag and refresh slot UI on consume so the FORMATION chip disappears from the battlefield frame (big-card review tooltip still shows the keyword as static card text). Added a FORMATION status chip in BoardSlot.gd that renders only while unconsumed, using `icon_guard.png` as a placeholder pending an art pass for a dedicated `icon_formation.png`. Rewrote design §2 and revised §10/§11/§12/§13 ruling notes (Squire of the Order, Battle Drillmaster, Vanguard Marshal balance flag, Runebound Initiate dual-tag-flank). Migrated 5 Formation probes in TriggerHandlerTests to `formation_fired` assertions; added new probes `_formation_consumed_once_per_lifetime` and `_formation_flanked_by_two_formation_partners_fires_all_three`.\n\nFollow-ups: dedicated `icon_formation.png` art asset (currently using `icon_guard.png` placeholder)."}, {"id": "\"037\"", "title": "Tighten Formation to require same-race minions on BOTH sides", "status": "done", "area": "combat", "priority": "normal", "started": "2026-05-16", "finished": "2026-05-16", "file": "037-formation-both-sides-required.md", "body": "## Description\n\nStrengthen the Formation trigger condition from \"at least one same-race adjacent neighbor\" to \"same-race minions present on BOTH the left and the right adjacent slots.\" The actor's race is checked independently against each side via `shares_race`, so dual-tag minions (e.g. Runebound Initiate, Squire of the Order) can have either tag satisfy each side. Edge-slot minions (slots 0 and N-1) become permanently unable to fire Formation normally — Battle Drillmaster becomes the only path to fire an edge-slot Formation. Trigger remains summon-event-keyed (same as task 036). This is a meaningful balance nerf to Knight T0 / Shield Bearer / Rank Breaker / Shield Squire / Squire of the Order / Initiate, doubling the positional setup required for any Formation effect. Update engine handler, design doc §2, all card design notes referencing the old single-neighbor rule, and add probes for the both-sides gate (one-side fail, edge-slot fail, dual-tag-mixed-races pass).\n\n## Work log\n\n- 2026-05-16: opened.\n- 2026-05-16: closed.\n\n## Summary\n\nTightened Formation trigger from \"at least one same-race adjacent neighbor\" to \"same-race partners on BOTH left and right adjacent slots.\" Added `_formation_both_sides_satisfied(actor, card)` helper in CombatHandlers.gd that checks `slot_index − 1` AND `slot_index + 1` are filled with race-matching partners via `shares_race` (so dual-tag actors can have either tag satisfy each side independently). Edge-slot minions (slot 0 or last slot) can never fire Formation normally — Battle Drillmaster bypass becomes the sole rescue path for edge Formations. Trigger remains summon-event-keyed (combined with task 036 one-shot consumption: an actor needs a summon event near it AND both-sides sandwich AND its own `formation_fired == false`). Rewrote 7 Formation tests to sandwich setups and migrated 4 B1 talent tests (iron_formation / commanders_reach / unbreakable variants) to pre-place a Human on both sides of the Knight; added 4 new probes (only-one-neighbor blocked, edge-slot impossibility, one-side-wrong-race blocked, dual-tag mixed-race-flanking passes). Revised §2 + the Knight T0 talent row + §10 Squire/Shield Bearer matrix rows + §11 Shield Bearer / Rank Breaker / Drillmaster notes + §12 Shield Squire + §13 Initiate notes to use sandwich language. Net balance: significantly harder to set up Formation triggers (roughly halved trigger frequency), Drillmaster becomes substantially more valuable. 695/695 tests pass."}, {"id": "\"038\"", "title": "Implement rally_the_ranks + adjacent-summon infra + dual-tag race picker", "status": "done", "area": "combat", "priority": "normal", "started": "2026-05-16", "finished": "2026-05-16", "file": "038-rally-the-ranks-adjacent-summon-infra.md", "body": "## Description\n\nSplit out from task 023 because Rally the Ranks (Korrath core spell §10) needs three new pieces of generic infrastructure: a `target_type` that accepts \"friendly Human OR Demon\" minions, a SUMMON step variant that places tokens into the two slots adjacent to a chosen target minion (instead of any free slot), and a runtime race-picker modal so the player can choose Human or Demon when the chosen target carries both tags (e.g. Abyssal Knight under runeforge_strike, or Squire of the Order). All three pieces must also work on the sim side so enemy AI / balance sims can resolve the spell. Card body itself is trivial; the infra is the work.\n\n## Work log\n\n- 2026-05-16: opened.\n- 2026-05-16: closed.\n\n## Summary\n\nShipped `rally_the_ranks` (2M Korrath core spell) plus all three pieces of reusable infrastructure split from task 023: (1) `friendly_human_or_demon` target_type added to Targeting validation + highlight wiring; (2) SUMMON step extended with `adjacent_to_target: bool` + `adjacent_side: \"left\"|\"right\"` fields, dispatched via new `_summon_token_at_slot` on both CombatScene and CombatState (refactored the existing `_summon_token` paths to share extracted `_spawn_token_into_slot[_vfx]` cores — no duplication); (3) generic dual-tag race-picker via `EffectContext.extra_cast_data: Dictionary` plumbed through `cast_player_targeted_spell` (live) and both `commit_play_spell` paths (sim), gated by new `ConditionResolver` conditions `rally_race_human`/`rally_race_demon`. Live combat shows a new programmatic `combat/ui/ChoiceModal.gd` (2–4 option modal, reusable for any future \"spell needs a runtime choice\" UX); sim falls back to `CombatState._rally_pick_race_for(owner)` heuristic (dominant friendly race, tie → demon). Rally itself is declared declaratively as 4 conditional SUMMON steps. Edge slots and occupied adjacent slots silently fizzle (\"up to 2\" semantics). Added `TestHarness.spawn_friendly_at` for slot-specific test setup. 729/729 tests pass (9 new Rally probes + 1 heuristic probe).\n\nFollow-ups: ChoiceModal styling is bare-bones (no theme, no animation) — polish pass when other modals join. The race-picker is hardcoded by `spell.id == \"rally_the_ranks\"` in `CombatScene._resolve_spell_extra_cast_data`; when a second spell needs a cast-time modal, refactor that switch into a per-spell registry. Sim AI doesn't currently cast Rally (no enemy deck holds it), but the plumbing and heuristic are ready when an enemy deck eventually does."}, {"id": "\"039\"", "title": "Live/sim unification refactor plan (design/refactors)", "status": "done", "area": "combat", "priority": "normal", "started": "2026-09-22", "finished": "2026-09-22", "file": "039-live-sim-unification-refactor-plan.md", "body": "## Description\n\nWrite an executable, phase-by-phase refactor plan under `design/refactors/` that removes live-vs-sim drift for good: one rules engine on CombatState, a command API, an event journal consumed by presentation, engine-owned RNG, and parity/lint tripwires in the test suite. Each phase must be runnable by a coding agent with concrete file anchors, acceptance checks and rollback notes.\n\n## Work log\n\n- 2026-09-22: opened.\n- 2026-09-22: closed.\n- 2026-09-23: revised after a 3-agent verification pass against 1c9aa30. Added live bugs B7–B13 (turn-end events never fire live, Korrath rune crashes, CombatSetup stats no-op, unforwarded one-shot flags, champion race, Smoke Veil, corruption in VFX drain) and divergences B14–B17 with decisions D7–D11. Split Phase 2 into 2A (sim/tests + shared turn/trap engine), then moved the live switch into Phase 3 behind a new de-async step 3.0. Committed scope is now Phase 0 → 2A (~5 sessions), with a checkpoint before 3–5. Appendix C lists every correction.\n\n## Summary\n\nWrote `design/refactors/LIVE_SIM_UNIFICATION_PLAN.md`: a six-phase, step-numbered plan (0 foundations/hotfixes, 1 state ownership, 2 command API + single agent + trap routing, 3 event journal + ViewState, 4 collapse duplicates, 5 parity test + lint tripwires) with file:line anchors, create/modify/delete lists, grep gates per step, a phase evaluation table and six owner decisions (D1–D6). Verified during review: two live-only handler crashes, sim-only enemy resource curves, divergent trap routing, missing Guard enforcement in sim, and a dead Imp Barricade redirect path; all are addressed by named steps.\nFollow-ups: owner must answer D1–D6 before Phases 2–4; each phase should be opened as its own task; the Korrath unlock hotfix and the talent→pool mapping consolidation are noted as separate work."}, {"id": "\"040\"", "title": "Live/sim unification — Phase 0 (foundations + hotfixes)", "status": "done", "area": "combat", "priority": "normal", "started": "2026-09-23", "finished": "2026-09-23", "file": "040-live-sim-unification-phase-0.md", "body": "## Description\n\nExecute Phase 0 of `design/refactors/LIVE_SIM_UNIFICATION_PLAN.md`: fix the live-only handler crashes and dead talent flags (B1, B8–B11), fire turn-end events in live (D7 = fire), and add the foundations — engine lint, engine-owned seeded RNG, state digest + determinism probes, a headless live smoke test, and the Korrath unlock pools. One commit per green step.\n\n## Work log\n\n- 2026-09-23: opened. D7 = fire turn-end events. Commit per step approved. Baseline suite 784/784.\n- 2026-09-23: prerequisites committed — 0.605 (task 009 shop korrath wiring), 0.606 (revised plan).\n- 2026-09-23: lint v1 (L1) written first to record the baseline: **39 errors** (plan estimated ~25). 9 were the sim-only `enemy_essence_max/enemy_mana_max` fallback branches → `tools/lint/l1_allow.txt` (4 entries); 30 real. Beyond the plan's list, L1 also found unforwarded diagnostic counters (`_detonation_count`, `_spark_spawned_count`, `_spark_transfer_count`, `_rift_lord_plays`, `_immune_dmg_prevented` — silent no-ops live, no crash) and the `enemy_active_environment` fallback in `CombatHandlers._opponent_env`.\n- 2026-09-23: 0.1 — all 30 rewritten to `.state.X`; `MinionInstance.add_armour(amount, state: CombatState)` now typed (callers pass `.state`); `CombatSetup._set_stat` writes registry stats to `scene.state` with an assert (checked: no registry key has an unforwarded scene-local copy); `_summon_enemy_champion` sets the `_summoned` flag + count before the death-anim await (B11). Lint 0, 789/789 (+2 probes: VRP summons exactly once over 8 spells; registry stats land on state).\n- 2026-09-23: 0.2 (D7 = fire) — `CombatScene._on_turn_ended` fires ON_PLAYER_TURN_END / ON_ENEMY_TURN_END before the side's cleanup (and bails if combat ended); `SimState.end_player_turn` now fires ON_PLAYER_TURN_END too. Probe: Altar Thrall's \"end of your turn, sacrifice\" (a shipped Seris card that had never worked, live or sim). **Balance delta: none** — `BalanceSimBatch --runs 100 --seed 7` (Acts 1+2, 150 rows) is byte-identical before/after: the enemy-side events already fired in sim and no preset deck uses a player-side turn-end effect. So D7 brings live in line with what the sim already modelled (void_unraveling, captain_orders, abyssal_mandate, champion_vs/vch, hollow_sentinel, pack_frenzy revert now run in the real game).\n- 2026-09-23: 0.6 — `debug/tests/LiveSmoke.tscn` (separate process in run_checks.sh): F1 boots with a 4-card hand and completes an enemy turn; F13 fires 6 enemy spells and gets exactly one VRP champion. ~8 s. Verified it catches B1: against the pre-0.1 handlers it prints `SCRIPT ERROR: Invalid access to property '_champion_vrp_spells_cast' on CombatScene`. `UserProfile.saving_disabled` keeps tests off the dev profile. Teardown waits for hand-draw / VFX coroutines to drain (freeing mid-await printed a HandDisplay SCRIPT ERROR). 3/3 stable runs.\n- 2026-09-23: 0.7 — korrath_common / korrath_iron_vanguard added to `GameManager.grant_boss_unlocks` and `UserProfile._ensure_default_unlocks`.\n- 2026-09-23: 0.4 — engine RNG on CombatState; 43 call sites migrated; seeded before any shuffle (sim: `run(…, rng_seed)`; live: `GameManager.next_combat_seed` / rolled, logged as `Seed: N`). Lint L2 (43 hits on old code → 0).\n- 2026-09-23: 0.5 — `SimState.digest_text()` (on SimState, not CombatState, until 1.3 hoists hands/decks/resources) + two determinism probes; runs start from different global seeds, and mutation-checked (a global shuffle on either deck fails them). 797/797.\n- 2026-09-23: phase gates — lint 0 (L1, L2); run_checks green (797/797 + LiveSmoke); `BalanceSimBatch --act 1 --runs 50 --seed 7` identical on two consecutive runs. Docs: TESTING.md (run_checks, lint, LiveSmoke, seeds), ARCHITECTURE.md (invariants 11–12, tooling), CLAUDE.md (refactor gate), plan header progress.\n- 2026-09-23: closed.\n\n## Summary\n\nShipped Phase 0 of the live/sim unification plan (0.605–0.614): fixed ~30 rules-code accesses that crashed or silently no-oped only in live combat (VRP/Abyss Sovereign champion crashes, Korrath rune talents, dead talent stat flags, champion re-summon and double-summon race), fired turn-end events in live (D7 — ~10 dead handlers incl. Altar Thrall now run; sim balance output byte-identical), moved all gameplay randomness onto a seeded engine RNG with seed + state digest returned from every sim run, and added the Korrath permanent-unlock pools. Added `tools/run_checks.sh` (import → lint L1/L2 → RunAllTests → headless live CombatScene smoke, failing on any SCRIPT ERROR); the smoke test was verified to reproduce B1 on the old code. 784 → 797 tests.\nFollow-ups: Phase 1 (rules code addresses `state`; empty `tools/lint/l1_allow.txt`; move `digest_text` to CombatState). B12 (Smoke Veil cancels the wrong attack) and B13 remain open until Phase 3.0."}, {"id": "\"041\"", "title": "Live/sim unification — Phase 1 (rules code addresses state)", "status": "done", "area": "combat", "priority": "normal", "started": "2026-09-23", "finished": "2026-09-23", "file": "041-live-sim-unification-phase-1.md", "body": "## Description\n\nExecute Phase 1 of `design/refactors/LIVE_SIM_UNIFICATION_PLAN.md` in the plan's order (1.1 → 1.3 → 1.4 → 1.2 → 1.5): add the presenter seam and lint L3/L4, hoist enemy-side and player resource/deck/hand state onto CombatState, move the gameplay-only scene/SimState method pairs onto CombatState, rewrite the rules code to address a typed `state` (presentation only through a nullable `presenter`), and put RelicRuntime on state. One commit per green step; `tools/run_checks.sh` gates every step.\n\n## Work log\n\n- 2026-09-23: opened. Reviewed Phase 0 (0.605–0.614) against the plan — no defects found; baseline `tools/run_checks.sh` green: lint 0, 797/797, LiveSmoke OK.\n- 2026-09-23: 1.1 — `CombatState._scene_facade` → `presenter` (null in sim); `_get_scene_facade()` kept (presenter-or-self). `tools/lint/presentation_allowlist.txt` + lint L3/L4, computed but not enforced until 1.2 (baseline L3 477, L4 163 — the 1.2 work list). **Deviation:** a third route besides `state.` / `presenter.`: `[facade]` for the 8 CombatScene overrides whose live body is still VFX-bound (`_apply_void_mark`, `_corrupt_minion`, `_deal_void_bolt_damage`, `_deal_enemy_void_bolt_damage`, `_fire_ritual`, `_sacrifice_minion`, `_summon_token`, `_summon_token_at_slot`) — routing them to `state` would drop the projectile/sigil/ritual VFX or change B13 timing; they stay on the facade (scene live, state in sim) until Phase 3.0, and L3 requires each to be a func on both classes. L4 is receiver-based (object handles only) — a blanket `.get(\"` ban would hit Dictionary reads. Pack Instinct's ATK-label hold moved from the handler into `_spawn_pack_instinct_buff_vfx(minion, old_atk)`.\n- 2026-09-23: 1.3 — CombatState now owns turn_number, is_player_turn, both sides' resources, decks, hands, graveyards, enemy_limited_cards, attack_cancelled and enemy_play_target, with side-agnostic accessors (hand_of/deck_of/graveyard_of/traps_of/environment_of/essence_of/…) and mutators (draw_cards, add_to_hand, remove_from_hand, send_to_graveyard, setup_deck, gain/spend/grow/convert, can_afford, refill_resources) + signals resources_changed/card_drawn/card_generated. TurnManager and EnemyAI are façades (forwarding properties; TurnManager relays the player-side signals). SimState lost the hoisted vars, draw helpers and owner helpers; SimTurnManager is a façade; SimEnemyAgent's duck-type block is gone. `_current_turn` retired in favour of `turn_number` (live never set `_current_turn`: graveyard stamps were 0 live and F15's `_sovereign_transition_turn` was always 0). `digest_text` moved to CombatState. EffectResolver/ConditionResolver/TargetResolver/HardcodedEffects/CombatHandlers/CombatSetup/RelicEffects: no `enemy_ai`/`turn_manager` left (gate 0). `EnemyHeroPanel.update` takes the state (10 call sites, not 14). PhaseTransition reads/writes typed state. `tools/lint/l1_allow.txt` emptied. Behaviour changes (live is the spec; sim moves): player draw into a full hand burns in sim; generated player cards fire ON_PLAYER_CARD_DRAWN in sim (fire moved from the scene's hand-display callbacks into state); sim now has a turn flag, so `enemy_turn`/`player_turn` conditions and Soul Rune's opponent-turn gate work there; sim P2 transition clears the enemy spell-tax penalty. Live: opening maxima no longer count as a growth choice (backing fields). +6 probes (809). **Caught by the balance batch, not the suite:** deleting SimEnemyAgent's duck properties made `CombatAgent.effective_minion_essence_cost`'s `get(\"essence_cost_discounts\")` return null → F2 lost corrupted_death (+10–40 pts player win rate). Replaced the duck-typing with typed virtuals `_essence_cost_discounts()` / `_minion_essence_cost_aura()` + a mutation-checked probe. **Balance:** `BalanceSimBatch --runs 100 --seed 7` (Acts 1+2) vs pre-1.3: identical except F6 Swarm/Scout's Lantern 93→92% (draw-burn on Lantern's draw 2).\n- 2026-09-23: 1.4 — one CombatState body for every CombatScene/SimState pair (lint `--report-pairs` = L5: 21 → 0; SimState 680 → 199 lines, now setup + sim turn engine + bus bridge). `_on_minion_vanished` / `_on_hero_damaged` / `_on_hero_healed` live on state (both shells connect combat_manager there) with presenter hooks `_on_minion_vanished_visual`, `_defer_on_death_vfx`, `_on_hero_damaged_visual(outcome)`, `_on_hero_healed_visual`; `_combat_ended` guard, Bone Shield log, first-lethal-sets-winner (live now sets `winner` too; F15 transition via `PhaseTransition.attempt(facade)`). Also moved: `_register_env_rituals`, `_unregister_env_aura`, `_consume_fiendish_pact_discount`, `_resolve_void_devourer_sacrifice`, `_summon_void_spark`, player champion auto-summon (`_check_champion_triggers`…), cost/spark payment (`pay_card_cost` with Dark Mirror, `available_sparks`, `can_afford_sparks`, `pay_sparks`); CombatHandlers ref is `CombatState._handlers` (SimState `_handlers_ref` gone). Diagnostic counters (`_player_ritual_count`, `_debug_soul_forge_fires`, `_debug_corrupt_flesh_fires`) incremented in the state bodies, so the SimState overrides of `_fire_ritual` / `_soul_forge_activate` / `_log` are gone (sim debug printing subscribes to `combat_log`); sim's `_seris_corrupt_activate` wrapper → profiles call `_seris_corrupt_apply` (the scene's `_seris_corrupt_activate` is the UI targeting entry — same name, different job). Presentation stubs deleted from SimState; rules code calls them null-checked on `presenter` (CombatHandlers/HardcodedEffects gain `state` + `presenter`). **Deleted, not ported:** void-bolt passive path (B4: `_apply_void_bolt_passive(s)`, `MinionCardData.on_void_bolt_passive_effect_id`, BoardEvaluator read), Imp Overload `_temp_imps` (nothing ever appended), `_resolve_on_death_effect` placeholder, unused scene helpers (`_find_random_enemy_minion`, `_summon_void_imp`, `_count_void_imps_on_board`, `_is_void_imp_type`, `_count_with_tag`, scene copies of `_find_random_minion` / `_count_type_on_board` / `_rune_aura_multiplier`). **New tooling:** `tools/lint/load_all_scripts.gd` in run_checks — compiles all 192 scripts (tests only reach some). Sim behaviour now follows live: Void Devourer sacrifices (was a `pass` stub), Void Spawner's Spark and player champion auto-summon (were scene-only), heals clamp at max HP (sim had no max HP — SimState.setup now sets both), damage_dealt emitted for player-side hits (dmg_log filters to the enemy hero). +3 probes (818). **Balance** (vs post-1.3, 100 runs seed 7): mean win Δ +1.2 pts, end-HP Δ −12; S.Forge +7.9 avg (up to +17 on F6) — its preset runs Void Devourer, whose sacrifices now tick the Soul Forge; every other profile within ±1.\n- 2026-09-23: 1.2 — rules code addresses a typed `state` (L3 370 → 0, L4 152 → 0; both now enforced). Done as a classifier rewrite (every `shell.X`: `.state` collapsed, [facade] names kept on the shell, CombatState members → `state.X` / `ctx.state.X`) plus pattern transforms for string duck-typing on typed fields (`get(\"X\") == true`, `set(\"X\", v)`, null-guarded counters) and `has_method` guards (state funcs: guard + dead `else` fallback removed; presentation: `presenter != null`), then ~25 hand edits. CombatHandlers/HardcodedEffects/RelicEffects carry `state` + a `presenter` getter; CombatManager keeps `scene` (set by the shells) with null-safe `state`/`presenter` getters; EffectContext has typed `ctx.state` / `ctx.presenter`. `MinionInstance.effective_spark_value(st: CombatState)` (callers pass `.state`); relic trap cap reads `CombatState.TRAP_SLOTS_MAX` instead of the scene's panel count; presence-aura's `_silent_buff_apply` is a presenter flag. `grep has_method(` in CombatHandlers/HardcodedEffects/RelicEffects/CombatManager → 0 each. L4 also catches `\"x\" in <handle>`. `BalanceSimBatch --runs 100 --seed 7` byte-identical to 1.4 (pure refactor). Also: `tools/run_checks.sh` gets a per-run timeout watchdog (a getter I broke made RunAllTests spin; macOS has no `timeout`), and the Phase-0-committed `tools/lint/__pycache__` is untracked + ignored.\n- 2026-09-23: 1.5 — `CombatState.relic_runtime`; CombatScene `_setup_relics` builds it on state (the `_relic_runtime` var is gone), CombatSim uses it instead of a local `relic_rt` (gate grep: only `state.relic_runtime` forms). `digest_text` gains a relics line (charges/cooldown), completing the 0.5 spec. Also: CombatSim writes the opening player maxima to the backing fields so sim no longer starts every fight with `last_player_growth = \"essence\"` (live's start_combat does the same). Acts 1–2 batch byte-identical to 1.2; `--fight 15` byte-identical to 0.618.\n- 2026-09-23: phase close-out — L5 enforced by default (L1–L5 all active, 0 errors); SimState 199 lines; `has_method(` 0 in every rules file. LiveSmoke gains a third scenario driving the rewired live paths on a real CombatScene (token summons both sides, lethal attack → death animation, hero damage, clamped heal). Docs: ARCHITECTURE.md (state owns rules+resources, state/presenter/facade routes, sim table, invariants 4/9/11 rewritten), TESTING.md (L3–L5, load_all_scripts, timeout), CLAUDE.md (handler-authoring rule), plan header (Phase 1 done + deviations).\n- 2026-09-23: closed.\n\n## Summary\n\nShipped Phase 1 of the live/sim unification plan (0.615–0.620): CombatState now owns both sides' turn/resources/decks/hands/graveyards, the CombatManager signal handlers, card/spark cost payment and RelicRuntime; every CombatScene/SimState gameplay pair collapsed to one state body (SimState 680 → 199 lines); and all rules code reads/writes a typed `state`, calls presentation through a null-checked `presenter`, and touches the shell only for 8 VFX-bound `[facade]` calls — enforced by lint L1–L5 plus a whole-project compile check and a timeout watchdog in `run_checks.sh`. Along the way sim started doing what live did (draw-burn, turn flag, Void Devourer, Void Spawner, champion auto-summon, heal clamp; batch mean +1.2 pts, S.Forge +7.9) and several live-only bugs were fixed (graveyard turn stamps and F15 transition turn were 0 live). 797 → 818 tests; LiveSmoke has 3 scenarios.\nFollow-ups: Phase 2A (engine commands, shared turn engine, trap routing, resource-growth hook); the `[facade]` list and presenter-deferred buff/death mutation wait for Phase 3.0; owner play-test of a Seris and an F15 fight is advisable since presenter hooks for hero damage/death animations were rewired (covered only by LiveSmoke)."}, {"id": "\"042\"", "title": "Live/sim unification — Phase 2A (engine commands, shared turn engine, trap routing)", "status": "done", "area": "combat", "priority": "normal", "started": "2026-09-23", "finished": "2026-09-23", "file": "042-live-sim-unification-phase-2a.md", "body": "## Description\n\nExecute Phase 2A of `design/refactors/LIVE_SIM_UNIFICATION_PLAN.md`: give CombatState a synchronous `cmd_*` surface used by sim and tests, share trap routing and the turn engine between both shells, unify enemy resource growth on one hook, move sim onto a single StateAgent + ProfileRegistry (deleting SimPlayerAgent / SimEnemyAgent / SimTurnManager), put encounter data in one table, and add sim replay. Live input and the live enemy turn stay on EnemyAI / `_try_play_*` until Phase 3.4.\n\n## Work log\n\n- 2026-09-23: opened. Owner decisions: **D1 = port** the 17 enemy growth curves to the shared hook; **D2 = live player order** (refill → draw → unexhaust → ON_PLAYER_TURN_START); **D9 = symmetric enemy order** (growth → refill → Void Rift Lord drain → draw → unexhaust → ON_ENEMY_TURN_START); **D8 = before** (ON_PLAYER_SPELL_CAST fires before resolution, live changes); **D10 = next turn start** (player growth choice stored at end-turn, applied in begin_turn(\"player\")); **D5 = façade** (TurnManager stays as a façade in 2A, default). Pre-2A balance baseline captured at e4293d9: `BalanceSimBatch --act 1|2 --runs 200 --seed 7`, 0 SCRIPT ERROR. Outputs in `tasks/042-balance/`. Suite baseline 818/818 + LiveSmoke.\n- 2026-09-23: 2A.1 — `CommandResult` + a `# Commands` section on CombatState: `cmd_play_minion / cmd_play_spell / cmd_play_trap / cmd_play_environment / cmd_attack / cmd_attack_hero / cmd_consume_minion / cmd_activate_relic / cmd_hero_skill`, one body per command for both sides, validate-then-mutate (refusals leave digest + log untouched), costs paid inside (`card_cost`, `minion_essence_cost`, `spell_cost`, `spark_cost_of`, Dark Mirror via `pay_card_cost`, Fiendish Pact consumption), `command_log` with targets by slot / hero sentinel. Rules folded in: player spell board discount (Void Archmagus `mana_cost_discount` — sim profiles never applied it), Phase Disruptor counter both sides, **Null Seal / Silence Trap `_spell_cancelled` now checked for both sides** (sim never checked it for enemy spells), Guard as validation both sides (no random redirect), Smoke Veil `attack_cancelled` + attacker-died-to-trap on enemy attacks, trap cap + duplicate rule both sides, `ON_*_TRAP_PLACED` both sides (B6), environment replace runs both halves (on_replace for its owner — `_unregister_env_aura` gained `owner`; player ritual handlers), minion event order = live's (slot → PLAYED → board → SUMMONED) for both sides, D8 spell-cast event before resolution. **Spark costs:** fuel is an input (`extra.spark_fuel`, the caller's pick; shortfall paid in Mana under `mana_for_spark`) or the engine's `pay_sparks` pick when absent — so profiles that plan fuel won't double-pay at 2A.5. Blood Chalice takes its target as input (resolves via `_spell_dmg` like live; sim's auto-pick moves to SimRelicPolicy in 2A.6). Imp Barricade `redirect_attack_target` deleted from EnemyAI (nothing wrote it). New `CommandTests` layer (+127 assertions → 945). **Deviations:** `cmd_end_turn` lands with the turn engine in 2A.3; `void_manifestation` follows live (plain attack tagged VOID_BOLT — crit/lifedrain/attack triggers, no Void Mark bonus; CardModRules documents that as the intended migration) — sim's `_deal_void_bolt_damage` bypass goes when sim moves onto commands (2A.5; DESIGN_DOCUMENT still says \"with Void Mark bonus\"). **Found, not fixed (out of scope):** Squire of the Order's \"Abyssal Knights cost 2 less Essence\" writes `essence_delta`, which the hand displays but no payment path (live or sim) reads — the discount never applies; enemy Fiendish Pact (`_enemy_fiendish_pact_pending`) is set but never consumed.\n- 2026-09-23: 2A.2 — trap routing in the engine, shared by both shells. `CombatState.TRAP_ROUTES` (live's 9 routes, same events/owners/priorities) registered first inside `CombatSetup.setup` via `_on_trap_route` → `_fire_traps_for(owner, trigger, minion)`: exact trigger match (no `mirror_trigger`), skipped while blocked, non-reusable traps consumed **before** resolving, player friendly-death route only on the enemy's turn, `trap_fired` signal. Live resolution goes to `presenter.play_trap_reveals(owner, [{trap, slot_index, resolve}])` (the old scene loop minus the gameplay — flash, card anim, resolve at impact, 0.6 s gap; allowlisted), sim/tests resolve inline. Deleted: `CombatState._check_and_fire_traps`, SimTriggerSetup's 4 routes, the scene's 9 `_trap_check_*` stubs + registrations. `TriggerManager.register` is an ordered insert (priority, then registration order) instead of a re-sort; `dump_order()` + a checked-in handler-order snapshot (`debug/tests/snapshots/handler_order.txt`, every registry id registered at once — delete the file to regenerate). +3 trap-route probes (friendly-death only on enemy turn, player trap on ON_ENEMY_TURN_START, enemy trap on ON_PLAYER_TURN_START incl. not-on-mirrored-event + Saboteur block) + the snapshot probe; LiveSmoke springs a probe trap through the live reveal path. No existing probe relied on `mirror_trigger` (none moved). 955/955 + LiveSmoke. Gate grep 0. **Balance:** Acts 1–2 byte-identical to the pre-2A baseline (no preset or enemy deck sets a non-rune trap — B3's \"no gameplay effect today\" confirmed). ARCHITECTURE \"Trigger event system\" updated (one registration path, trap routing, ordered insert).\n- 2026-09-23: 2A.3 — turn engine on CombatState, shared by both shells (D2, D5, D9, D10). `start_combat()` (both sides 1/1 via backing fields, enemy refilled, player turn 1), `begin_turn(side)`, `end_turn(side)`, `cmd_end_turn(side, growth)`, `choose_player_growth`, signals `turn_started(side, turn)` / `turn_ended(side)`, per-side `growth_hooks` (enemy: default curve when unset; player: only the pick or a hook). Player order (D2 = live): growth → refill → draw 1 → ready board (+ temp-buff expiry) → spell tax → Void Rift Lord drain → relic flags / hand deltas / Fiendish Pact / once-per-turn resets → relic tick → ON_PLAYER_TURN_START. Enemy (D9): growth → refill → tax → FP reset → drain → draw → ready board → ON_ENEMY_TURN_START (live used to fire the event before growth/refill/draw, 0.4 s ahead of them). D10: the pick is applied at the player's next turn start, but `last_player_growth` is recorded when picked, so F15 Abyssal Mandate keeps live's timing (reads the pick in the enemy turn that follows). The \"── Turn N\" log line moved into begin_turn. TurnManager is a façade (D5): `start_combat` builds the deck + opening 3 then `state.start_combat()`, `end_*_turn` → `state.end_turn` + `begin_turn`, relays the state signals; `player_turn_cleanup` (no listeners) deleted. CombatScene `_on_turn_started/_on_turn_ended` keep UI + the enemy kick-off; `_do_end_turn` calls `state.choose_player_growth`; `_setup_enemy_ai` installs `enemy_ai.grow_at_turn_start` as the enemy growth hook (first-turn skip + profile override + default — until 2A.4). `EnemyAI.run_turn` lost growth/refill/drain/draw. SimState's turn functions and **SimTurnManager deleted**; SimState wires its profile overrides into `growth_hooks` (until 2A.4); CombatSim loop = `start_combat` → player phases → `cmd_end_turn(\"player\")` → enemy phases → `end_turn(\"enemy\")` → `begin_turn(\"player\")`, and no longer resets relic flags / ticks relics itself. **Deleted, not ported:** Void Hourglass extra turn (`_relic_extra_turn` was never set true; the scene called a nonexistent `turn_manager.start_player_turn()`). Sim now does what live did: temp buffs (`BuffSystem.expire_temp`) expire at each side's turn start, player draw before ON_PLAYER_TURN_START. Tests: 3 probes moved to the engine API (Altar Thrall `end_turn(\"player\")`, turn-flag probe via `start_combat` / `cmd_end_turn`, phantom-deck hand add) + stale runic-echo KNOWN BUG comment removed (fixed in 1.3); +4 turn-engine probes (player order, enemy order incl. drain + first-turn no-growth, D10 growth timing + refusal, temp-buff expiry); LiveSmoke checks the Essence pick lands on turn 2 and the enemy is 1/1 after its first turn. 978/978 + LiveSmoke. Gates: `class_name SimTurnManager|_relic_extra_turn` 0; `await|get_tree()|create_timer` in CombatState 0. **Balance:** Acts 1–2 byte-identical to the baseline (verified the engine runs — DebugSingleSim prints the state's turn header); the ordering changes don't reach the Act 1–2 presets. ARCHITECTURE updated (turn engine row, TurnManager, SimState, SimTurnManager row removed). Note for the owner: an earlier suspicion that live enemies opened at 0/0 after 1.3 was wrong — `_setup_enemy_ai` set 1/1 (now `start_combat` does).\n- 2026-09-23: 2A.4 — one resource-growth hook (D1 = port). `CombatProfile.grow_resources(state: CombatState, side: String, turn: int)` (base = the engine default curve), run by `state.begin_turn(side)` through `growth_hooks`: live enemy via `EnemyAI.grow_at_turn_start` (→ the active profile; the `_first_turn` flag and `_choose_resource_growth` are gone — every curve skips turn 1 itself), sim both sides via CombatSim (enemy hook reads `state._e_profile`, so the F15 swap carries over). Ported by a scripted transform, restricted to the growth functions: 17 enemy + 6 player `setup_resource_growth` lambdas and their helpers (`sim_state.<side>_*_max += 1` → `state.grow_*_max(side)`, reads → `essence_max_of / mana_max_of / hand_of(side)`); Matriarch's separate live `grow_resources(enemy_ai)` folded into its one curve; **ScoredCombatProfile grows the side it plays** (the 4 enemy `scored*` profiles used to overwrite the *player's* growth and ran the default curve themselves). Deleted `setup_resource_growth`, `SimState.player/enemy_growth_override`, `EnemyAI._choose_resource_growth`. Probe: every profile's curve for turns 1–10 from 1/1 with an empty hand equals the values the old sim callables produced (captured before the port with a throwaway dump scene; 34 curves, scored* enemies updated for the fix). 1013/1013 + LiveSmoke. Gate grep 0. **Balance:** Acts 1–2 byte-identical (sim already ran these curves; the batch doesn't use scored* enemies). **Live difficulty changes (D1):** every encounter / deck variant whose profile has a custom curve now grows by it in the real game instead of the default \"Essence first, Mana when >2 behind\" — e.g. Matriarch pure Mana (1/10 by turn 10 vs 7/4), Void Ritualist Prime Mana-first (4/7 vs 7/4), Void Champion / Void Aberration Mana-heavy mid-game, Void Scout / Rift Stalker / Captain / Sovereign Essence to 5 first; full table in `CommandTests._GROWTH_CURVES`. Needs a live play-test (plan checkpoint).\n- 2026-09-23: 2A.5 — one agent for sim, one profile registry. New `enemies/ai/Pacer.gd` (base: no wait), `enemies/ai/StateAgent.gd` (one side of a CombatState; every action a `state.cmd_*` then `pacer.after_action`), `enemies/ai/ProfileRegistry.gd` (35 profiles, namespaced by side; EnemyAI and CombatSim both build from it). `CombatAgent` gains typed `state`, `side`, `hero_skill(id, target)`, `can_place_trap(trap)`, and `commit_play_spell(..., extra)`. **Profiles stop paying:** all 110 `agent.essence/mana -=` lines deleted in the same commit; live `EnemyAI.commit_*` now pays through `state.plan_cost / pay_planned_cost` (made public), so live is unchanged; LiveSmoke checks the enemy paid for its plays. **Spark fuel contract (deviation):** profiles pick and consume fuel through `agent.consume_minion` *before* playing (the plan assumed that path could stay as-is), so a command charging sparks would refuse or double-pay; both agents tally the spark value consumed and pass it as `extra.sparks_prepaid`, which `plan_cost` credits (shortfall → Mana under mana_for_spark, else refused). Side effect: VoidScout no longer overcharges Mana under F14 mana_for_spark (it computed the shortfall after consuming its fuel). Hero skills: Seris / Fleshcraft profiles call `agent.hero_skill` (→ `cmd_hero_skill`); `agent.sim` gone. Profile reads of the shell (`agent.scene.get/set(\"x\")`, `agent.scene.state`, …) → typed `agent.state` (only the SimState-only `debug_log_enabled` read stays on the shell). Deleted `sim/SimPlayerAgent.gd`, `sim/SimEnemyAgent.gd`, `enemies/ai/EnemyAIProfile.gd`, `SimState.enemy_ai`, `EnemyAI._PROFILES`, `CombatSim._ENEMY_PROFILES/_PLAYER_PROFILES` (BalanceSim's editor dropdown list renamed `_PLAYER_PROFILE_OPTIONS`). CombatSim runs both sides on StateAgents. **Refusal audit** (temporary print over a 20-run batch): 1128 player spells with a null target (profiles rely on SINGLE_CHOSEN's random AI fallback) → the command now accepts a null target (only a minion target must be on a board); ~1100 trap plays into full slots (the old sim let a side hold 4+ traps/runes) → profiles check `can_place_trap` at all 6 trap sites (live enemy now also stops at 3); 24 enemy attacks past a Guard (CorruptedHandler pass 1, B5) → it targets a Guard when one is up; what remains is legitimate (plays after combat ended; 23 rune plays whose Mana an awaited ritual-slot play already spent — the old sim ran Mana negative there). **Profile bugs fixed on the way:** \"don't replace an active environment\" read the *player's* environment for every side (enemies skipped their env whenever the player had one; Scored likewise) → own side; `_pick_default_trap_env_target` read the player's traps → the opponent's; SpellBurn's Pack-Frenzy threat read `scene.enemy_ai.mana` (null in sim now) → `state.mana_of(opponent)`; StateAgent's `opponent_has_rune_or_environment` checks the opponent (SimPlayerAgent checked its own side); VoidWarband's `_vw_*_plays` diagnostic was counted twice (agent + profile) → once. Sim now follows live on: minion event order both sides, D8, Guard, void_manifestation (no Void Mark bonus), Null Seal on enemy spells, the 3-slot trap cap, Void Archmagus discount. +2 probes (profile-driven play pays once; consumed spark fuel is credited, none → refused). 1020/1020 + LiveSmoke. Gates: `class_name SimPlayerAgent|SimEnemyAgent|EnemyAIProfile|_ENEMY_PROFILES|_PLAYER_PROFILES|const _PROFILES|agent.sim` 0; `agent.(essence|mana) -=` 0. **Balance** (200 runs, seed 7, vs pre-2A; same numbers as the final `tasks/042-balance/bal_post2a_*`): Act 1 mean +0.3 pts (max 4.5 — DeathCircle +1.6 avg), Act 2 mean +0.3 (max 7.0 — F5 Void Ritualist +1.8 avg: verified to be the 3-slot rune cap — lifting it for one run puts F5 back at −0.1). The Voidbolt −1.9 seen in a first pass came from the null-target refusals, not void_manifestation; after the fix it is +0.0.\n- 2026-09-23: 2A.6 — relic activation through the command, both shells. New `sim/SimRelicPolicy.gd` (static; CombatSim's `_try_relic_*` decisions — start-of-turn draw/imp/guardian or Dark Mirror, Mana Shard, Void Lens, Blood Chalice on the highest-ATK enemy minion, Bone Shield), each ending in `state.cmd_activate_relic(index, target)`; CombatSim calls them at the same points and no longer builds a RelicEffects. Live `_on_relic_activated` → `cmd_activate_relic`; Blood Chalice now enters targeting *without* spending, and `_resolve_relic_target_minion/hero` activate with the picked target (cancel no longer refunds — nothing was spent). RelicEffects' `relic_execute` auto-pick branch + `_pick_highest_atk_enemy` deleted (the command resolves it — via `_spell_dmg` like live, where sim used `apply_damage_to_minion`); the scene's own `_relic_effects` is gone (state builds one on first use). LiveSmoke drives Dark Mirror and Blood Chalice (target first, then 500 to the hero) through the relic bar. 1020/1020 + LiveSmoke. Balance vs 2A.5: identical win rates (the batch carries IT / MS / BS / SL, no Blood Chalice or Dark Mirror).\n- 2026-09-23: 2A.7 — encounter data in one place. New `enemies/data/EncounterTable.gd`: the 15 encounters from `GameManager._build_encounter` as data (generated from it, so live is the spec) plus `variant_profiles` per encounter (deck-variant and scored* profiles that share its passives — EncounterDecks' variant→profile map lives in the user's `user://encounter_decks.json`, so it can't be the source), with `entry / make_enemy / entry_for_profile / passives_for_profile`. `GameManager._build_encounter` → `EncounterTable.make_enemy` (`_make_encounter` + the 110-line match deleted); CombatSim's enemy passives → `passives_for_profile` (`_ENEMY_PASSIVES` deleted); BalanceSim's fight list (`_FIGHT_OPTIONS`, no HP) and ScoredAITest take enemy HP from the table — fixing their stale F2 2400 (live 2100) and F3 2600 / 3000 (live 2200). **F15: sim now has `champion_abyss_sovereign`** (missing from the sim table). Probe: every registered enemy profile maps to an encounter, GameManager builds each from the table, sim passives = live passives. 1075/1075 + LiveSmoke. Gate grep 0. **Balance:** Acts 1–2 identical to 2A.6; F15 (100 runs) with vs without the champion passive: mean −1.2 pts, Swarm −7.3 (e.g. SL+SA 41→32), others within ±1 on average (`tasks/042-balance/bal_2a7_f15*.txt`).\n- 2026-09-23: 2A.8 — sim replay. CombatSim split into `make_config(...)` (a fight's inputs as plain data) + `_build(config, seed)` (the wired SimState, both StateAgents/profiles, growth hooks, relics) + the loop; `replay(record)` rebuilds from `{seed, config}`, `start_combat`, re-issues `command_log` through `apply_logged_command` (hand index + card id check, targets / spark fuel by slot) and returns digest + first refused command. `record_replay` / `dump_replay_path` add `result[\"replay\"] = {seed, config, command_log, digest}` (and write it as JSON). New `debug/ReplayRunner.gd/.tscn` (`-- <path>`: prints digest, first refusal, exit 0 iff the digest matches); SimRunner `--dump-replay <path>`. Two things had to change for replays to reproduce: (1) the enemy's turn end in CombatSim is now the logged `cmd_end_turn(\"enemy\")` (the per-turn snapshot callback hangs off `state.turn_ended`); (2) **AI decision randomness moved off the engine RNG** — `CombatAgent.decision_rng` (seeded from the combat seed + side) for `_pick_default_trap_env_target`, the one profile site that drew from `state.rng`, so a profile-less replay draws the same engine randoms. Probe: 3 fights (Swarm vs F1, Seris + relics vs F2, Swarm vs Void Warband / spark fuel) round-trip through JSON and replay with every command accepted and the same end digest; end-to-end SimRunner → file → ReplayRunner checked by hand (20 commands, digest match). TESTING.md: ReplayRunner, command replay, L5 CommandTests, snapshot note. 1084/1084 + LiveSmoke. Balance: Acts 1–2 identical to 2A.7.\n- 2026-09-23: 2A.9 — phase gates. Lint **L6** (no `await` / `get_tree(` / `create_timer(` in CombatState.gd) and **L7** (each `func cmd_*`, `begin_turn`, `end_turn`, `_fire_traps_for`, and the AI profile table defined once repo-wide) added and enforced; both verified to fire on planted violations. **Deviation:** L7 leaves out `start_combat` — TurnManager's D5 façade keeps its own (builds the deck, then calls the state's) until Phase 4. Gates: `run_checks.sh` green (lint 0 with L1–L7, 1084/1084 incl. the CommandTests layer and the handler-order snapshot, LiveSmoke OK); the 2A.1–2A.8 gate greps all 0. Final balance `tasks/042-balance/bal_post2a_act{1,2}.txt` vs `bal_pre2a_*` (200 runs, seed 7): Act 1 mean +0.3 pts (max 4.5 — DeathCircle +1.6), Act 2 mean +0.3 (max 7.0 — F5 Void Ritualist +1.8 from the 3-slot rune cap); F15 separately −7.3 for Swarm (`bal_2a7_f15*`). Docs: ARCHITECTURE (engine owns turn engine / trap routing / commands; where each side drives the engine after 2A), TESTING (L6, L7), plan header (2A done + deviations; next: checkpoint).\n- 2026-09-23: closed.\n\n## Summary\n\nShipped Phase 2A of the live/sim unification plan (0.621–0.629): CombatState now has a synchronous, validate-then-mutate command surface (`cmd_*`, costs paid inside, `command_log`), one turn engine and one trap router for both shells, and a single resource-growth hook, so the real game now runs the per-encounter enemy curves sim was tuned with (D1). Sim runs both sides on one StateAgent over the commands with one ProfileRegistry, one EncounterTable (F15 gained its missing champion passive) and a SimRelicPolicy, and fights replay exactly from their command log (ReplayRunner); lint L6/L7 guard it. Sim now follows live on event order, Guard, trap cap, spell cancel and Void Manifestation (balance: +0.3 pts per act, F5 +1.8, F15 Swarm −7.3), and several profile bugs surfaced by a refusal audit were fixed.\nFollow-ups: the plan's checkpoint — owner play-test of the live changes (D1 enemy growth curves, D9 enemy turn order, D10 growth timing, D8 spell-cast order, Blood Chalice target-then-spend), retune if needed, decide D11/D3/D4 before Phase 3; found-not-fixed: Squire of the Order's essence discount never applies (essence_delta is display-only), enemy Fiendish Pact never consumed."}, {"id": "\"043\"", "title": "Live/sim unification — Phase 3", "status": "active", "area": "combat", "priority": "normal", "started": "2026-09-24", "finished": "", "file": "043-live-sim-unification-phase-3.md", "body": "## Description\n\nPhase 3 of `design/refactors/LIVE_SIM_UNIFICATION_PLAN.md`: make every gameplay mutation synchronous inside the engine (3.0 de-async), give the engine plain slot data (3.1a SlotState, D11), add the `CombatEvent` journal (3.1), build `ViewState` + `CombatPresenter` that plays one animation per event (3.2, D4 hybrid), delete the VFX gates (3.3), and switch live input and the live enemy turn onto `state.cmd_*` (3.4). Checkpoint decisions taken at the start: D11 = SlotState, D3 = on-death inline, D4 = hybrid ViewState.\n\n## Work log\n\n- 2026-09-24: opened. Checkpoint decisions D11 (SlotState), D3 (inline on-death), D4 (hybrid ViewState) recorded in the plan (section 3.3 table + \"Checkpoint decisions\" + new step 3.1a). Baseline `tools/run_checks.sh` at `5454e70`: green, 1084/1084, lint 0, LiveSmoke OK.\n- 2026-09-24: **3.1a — SlotState (D11), landed before 3.0** (deviation from the plan's order: taking occupancy off the view first removes the bridge's `place_minion`/`remove_minion` mutations from 3.0's list). New `combat/board/SlotState.gd` (RefCounted: `side`, `index`, `minion`, `is_empty`, `place` stamps `slot_index`, `clear`; both emit `changed`). `CombatState._init` allocates BOARD_MAX per side and relays `slot_changed(side, index)`; `slot_of`, `slot_for`. `BoardSlot` is a view: `place_minion`/`remove_minion` → `show_minion`/`show_empty` (no slot_index write); `CombatScene.player_slots/enemy_slots` are now the scene's own node arrays (the state forwarders are gone), `slot_node(side, i)`, `_find_slot_for` maps through the engine first, `_on_slot_changed` mirrors occupancy (a frozen node keeps a dead occupant's art until `_flush_deferred_death_for` plays its ghost — a placement into such a node flushes first). Engine occupancy is now taken **at once** on every live path: player card flight (`_try_play_minion_animated`), enemy reveal (`EnemyAI.commit_minion_play`), token/champion/sigil summons (`_spawn_token_into_slot_vfx`), the ritual demon (`_summon_void_demon_synced`); the node is frozen on its empty look until the entrance animation reveals it. Agents: `CombatAgent.find_empty_slot() -> SlotState` / `commit_play_minion(inst, slot: SlotState)` on both shells (EnemyAgent maps the index to the node for EnemyAI); 40 profile sites retyped. `_transfer_to_player_board`, Formation adjacency, `TargetResolver` ADJACENT, `EnemyAI.consume_minion`, PhaseTransition, TestHarness spawns read/write SlotState. Deleted: dead `CombatScene._try_play_minion` (no callers), `_clear_slot_for` (no callers), SimState's `BoardSlot.new()` loop (sim no longer leaks 10 Panels per fight — the batch's `108000 RIDs of type CanvasItem were leaked` warning is gone). Lint L6 extended: no `BoardSlot` in CombatState/SimState/CombatHandlers/EffectResolver/TargetResolver. Probe `CommandTests._slots_are_engine_slot_states` (14 assertions). **Live gameplay change:** a slot whose occupant died mid-animation is free for the engine immediately (a token summoned during the death animation can take it) — sim always did this. run_checks green (1084/1084 + probe, lint 0 with L6', LiveSmoke OK). **Balance:** Act 1 batch (200 runs, seed 7) byte-identical to `042-balance/bal_post2a_act1.txt`; Act 2 likewise vs `bal_post2a_act2.txt` (the only diff in both: the leaked-CanvasItem warning is gone). ARCHITECTURE (state layer, live shell, file table) and TESTING (L6) updated.\n- 2026-09-24: **3.0a — on-death inline (D3).** `CombatState._on_minion_vanished` no longer asks the presenter to defer; `CombatHandlers.on_minion_died_death_effect` resolves every minion's on-death steps and granted summons inside the death trigger on both shells. Deleted `CombatScene._pending_on_death_vfx` / `_defer_on_death_vfx` / `_minion_has_on_death` / `_resolve_deferred_on_death`, `CombatVFXBridge.resolve_deferred_on_death` (the death animation still plays the on-death icon and the Void-Touched Imp burst, now purely as visuals), and the two allowlist entries. **Live gameplay change:** on-death effects resolve before the killing effect continues (sim behaviour; e.g. Void-Touched Imp's death damage lands at death, not ~1.5 s later after the icon). Visual order (icon → summon sigil) is restored by the presenter in 3.2. run_checks green (1098/1098, lint 0, LiveSmoke OK).\n- 2026-09-24: **3.0b — buffs mutate in the engine at once.** `EffectResolver` BUFF_ATK / BUFF_HP and `HardcodedEffects._dark_covenant_passive` call `BuffSystem.apply*` immediately on both shells, then hand the presenter a pre-buff snapshot: `CombatScene._show_buff_apply(minion, source_tag, atk_before, hp_before)` (replaces `_request_buff_apply`) merges requests per minion+source, holds the slot labels at the pre-buff values (`BoardSlot.hold_stats`, kills running value tweens) and spawns one `BuffApplyVFX` per bucket with `set_stat_snapshot`; the VFX tweens pre → live at its pulse beat and no longer owns any mutation (`set_buff_intents` / `_apply_intents` / `_force_apply_remaining_intents` deleted — `grep BuffSystem.apply BuffApplyVFX.gd` → 0). Gameplay unchanged on both shells (sim already applied inline); live no longer risks a buff landing late or never when a VFX aborts. run_checks green (1098/1098, lint 0, LiveSmoke OK).\n- 2026-09-24: **3.0c — corruption, Void Mark, Void Bolt, traps and sacrifice mutate inline; five [facade] names retired.** `CombatState._corrupt_minion` / `_apply_void_mark` / `_deal_void_bolt_damage` / `_deal_enemy_void_bolt_damage` / `_sacrifice_minion` are the one body each; they call presenter hooks (`_show_corruption_applied` — capture-aware splash, `_show_void_mark_applied`, `_fire_void_bolt_projectile` / `_fire_enemy_void_bolt_projectile` — projectile only, `_on_minion_vanished_visual` — death animation) and the CombatScene overrides are deleted; the 12 rules-code call sites now address `state`. **B13 fixed:** corruption stacks apply at cast (the spell-popup drains only play the splash). **B12 fixed:** `_fire_traps_for` resolves each trap inline right after starting its card animation (`play_trap_reveals` is reveal-only) — Smoke Veil cancels the attack that sprang it, on both shells. Void Bolt damage lands when the effect resolves (the projectile still flies; the hero attack in `CombatInputHandler` no longer awaits impact). `SacrificeSystem.sacrifice(state, …)` takes the CombatState (no more `has_method` on the shell); `_on_demon_sacrificed` scene forwarder deleted. run_checks green (1098/1098, lint 0, LiveSmoke OK). Remaining [facade]: `_fire_ritual`, `_summon_token`, `_summon_token_at_slot` (3.0d).\n- 2026-09-24: **3.0d — token summons and rituals have one body; the bridge keeps only visuals; [facade] is empty.** `CombatState._summon_token` / `_summon_token_at_slot` / `_spawn_token_into_slot` (now return the instance; `_summon_delegate` and `_summon_token_pure` gone) place, log and fire ON_*_MINION_SUMMONED at once and call `presenter._prepare_token_reveal` (freezes the node before a champion banner / sigil) and `_play_token_summon` (plays it); `_fire_ritual` calls `presenter._on_ritual_firing` before consuming the runes (captures the panels, waits for the rune-placement VFX, plays the merge). Deleted from CombatScene: `_summon_token`, `_summon_token_at_slot`, `_spawn_token_into_slot_vfx`, `_fire_ritual`, `_fire_demon_ascendant_player_ritual` (+ `_is_demon_ascendant_ritual`, `_pick_random_minions` — the player's Demon Ascendant now runs the ritual's own `effect_steps` like the sim: 200 to 2 random enemy minions + a 500/500 demon), `_on_ritual_sacrifice_summon_champion`, `_play_player_ritual_vfx` (split into `_capture_ritual_visual` + `_run_ritual_visual`). `CombatVFXBridge`: `_reveal_after_sigil` and `champion_summon_sequence` no longer fire triggers; `play_ritual_sacrifice_sequence` / `_fire_demon_ascendant_tail` take the summoned demon and only animate (`_apply_ritual_damage` → `_show_ritual_hit` popup, `_summon_void_demon_synced` deleted); the enemy ritual sacrifice handler kills the imp, removes the runes, deals the damage, summons the demon and champion inline, then starts the sequence. `_summon_enemy_champion` no longer awaits `death_anims_done`. Token stat overrides now use the state's body on both shells (a duplicated card with the token's atk/hp/shield_max rather than live's instance-field writes — same effective stats). Allowlist: `+_prepare_token_reveal`, `+_play_token_summon`, `+_on_ritual_firing`; [facade] emptied; the `death_anims_done` / `_active_death_anims` / `is_inside_tree` gate names removed (no rules code awaits them). **Interim visual regressions (restored by the 3.2 presenter):** the ritual demon's sigil plays alongside the sacrifice VFX instead of after the beam; the player's Demon Ascendant no longer fires its projectile tail; a token that takes a slot whose occupant died mid-animation shows after the ghost. run_checks green (1098/1098, lint 0, LiveSmoke OK).\n- 2026-09-24: **3.0e — the last awaits; 3.0 complete.** `HardcodedEffects` Grafted Butcher AoE, Frenzied Imp damage, Brood Call summon and Pack Frenzy buffs land inline (the VFX hooks start first, fire-and-forget, so they still anchor on the target slots); the Corrupt Authority detonation consumes stacks and deals damage inline (`play_corruption_detonations(targets)` is animation only). **3.0 gate:** `await` count 0 in CombatHandlers / EffectResolver / HardcodedEffects / RelicEffects / CombatManager / CombatState; no `BuffSystem.apply`, slot placement, damage, kill or trigger fire in `CombatVFXBridge.gd` or any `*VFX.gd`; B12 probe (`CommandTests._attack_enemy_cancelled_by_smoke_veil`) is now the live path too. ARCHITECTURE (rules-code routes, traps, buff flow, progress), the allowlist header and the plan header updated. run_checks green (1098/1098, lint 0, LiveSmoke OK).\n- 2026-09-24: **3.1 — CombatEvent journal.** New `combat/board/CombatEvent.gd` (`seq`, `kind`, `side`, `turn`, `payload`, `kind_name()`); `CombatState.journal: Array[CombatEvent]` + `emit_event(kind, side, payload)`. Emit sites (old signals and presenter hooks keep firing, per the plan): LOG (`_log`), MINION_STATS_CHANGED (`_refresh_slot_for`), TRAPS_CHANGED (`_update_trap_display_for`; the two side-specific helpers and `_fire_ritual` route through it), ENVIRONMENT_CHANGED (`set_environment`, both sides), ARMOUR_CHANGED, HERO_BUFF_CHANGED, TOKEN_SUMMONED / CHAMPION_SUMMONED (`_spawn_token_into_slot`, `_summon_champion_card`), MINION_PLAYED + CARD_PLAYED (`cmd_play_minion`), CARD_PLAYED (`cmd_play_spell/trap/environment`), TRAP_PLACED / RUNE_PLACED, TRAP_FIRED, HERO_HP_CHANGED (hp setters), SLOT_CHANGED (slot relay), RESOURCES_CHANGED, CARD_DRAWN / CARD_GENERATED, VOID_MARKS_CHANGED, FLESH_CHANGED, FORGE_CHANGED, MINION_DIED (with `attacker`), MINION_SACRIFICED, MINION_CONSUMED (both consume paths), TURN_STARTED / TURN_ENDED, SPELL_CAST / SPELL_RESOLVED (inside `cast_player_targeted_spell`, `cast_player_hero_spell`, `cast_enemy_spell` so live's pre-3.4 spell path journals too), SPELL_COUNTERED (countered / cancelled), RELIC_ACTIVATED, HERO_SKILL, RITUAL_FIRED (after consumption, before the effect steps), VOID_BOLT (both sides), CORRUPTION_APPLIED, DAMAGE_DEALT (minion in `CombatManager._deal_damage` with amount / absorbed / hp_before / hp_after / school / source / is_crit; hero in `_on_hero_damaged`), PHASE_TRANSITION / COMBAT_ENDED (hero-damage outcome), HERO_HEALED, MINION_HEALED (`_heal_minion`, siphon), ATTACK_STARTED (`resolve_minion_attack[_hero]`), BUFF_APPLIED (EffectResolver BUFF_ATK / BUFF_HP, dark covenant — before/after stats), DETONATION. Deviations from the plan's kind list: `TRAPS_CHANGED`, `SLOT_CHANGED`, `HERO_HP_CHANGED`, `HERO_BUFF_CHANGED`, `HERO_SKILL` added as view resync points; `TRAP_REMOVED` / `CORRUPTION_REMOVED` folded into `TRAPS_CHANGED` / `DETONATION`. Live minion plays and enemy plays bypass the commands until 3.4, so they journal no MINION_PLAYED yet. Probes: `_journal_buff_applied_before_after`, `_journal_order_spell_kill_on_death_summon` (`[SPELL_CAST, DAMAGE_DEALT, MINION_DIED, TOKEN_SUMMONED, SPELL_RESOLVED]`). ARCHITECTURE (state layer, file table, progress) + plan header updated.\n- 2026-09-24: **3.2 + 3.4 — CombatPresenter, ViewState, live input and the enemy turn on commands.** New `combat/board/CombatPresenter.gd` (Node child of CombatScene): drains `state.journal` from a deferred start (a synchronous resolution is fully journaled before its first event plays), `await`s one animation per event, then applies the event to `ViewState` and refreshes the UI through `CombatUI`. Look-ahead consumption: `ATTACK_STARTED` takes the defender's and counter damage events and shows them at the lunge hit (`_play_attack_anim` / `_play_hero_attack_anim` are now awaitable; VOID_BOLT-school attackers fire the projectile instead); `SPELL_CAST` takes its damage / corruption / heal events up to `SPELL_RESOLVED` and shows them at the spell VFX impact — or per slot as a wave touches it (`play_captured_for_slot`, wired from VfxController's plague path); `VOID_BOLT` takes the hero hit for its projectile; consecutive `BUFF_APPLIED` (parallel BuffApplyVFX, awaited via `buff_vfx_batch_done`) and
