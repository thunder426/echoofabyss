`DETONATION` events batch. `VFX` journal events replace every card-specific presenter hook (grafted butcher, frenzied imp, brood call, pack frenzy, chevrons, void netter, presence aura, pack chain / instinct, feral reinforcement, ACP aura pulse, void-imp claw, ritual sacrifice — positions resolve from the minions' slots at playback; the ritual sequence takes the trap-panel indices). `ViewState.gd` holds the lagging scalars, traps, environments and turn; `LivePacer.gd` waits for `presenter.pump_and_wait_idle()` + 0.55 s. **Engine ordering:** MINION_DIED / SACRIFICED / CONSUMED, MINION_PLAYED, TOKEN / CHAMPION / MINION_SUMMONED are emitted *before* their slot mutation so playback animates the departing or arriving minion; `_sacrifice_minion(minion, source_tag)` carries the tag for SacrificeVFX; `_transfer_to_player_board` journals MINION_SUMMONED; the champion-from-hand path journals CARD_PLAYED. **Deleted from the state:** every animation hook (`_on_minion_vanished_visual`, `_on_hero_damaged/healed_visual`, `_show_corruption_applied`, `_show_void_mark_applied`, `_fire_*_projectile`, `play_trap_reveals`, `_prepare_token_reveal` / `_play_token_summon`, `_on_card_left_hand`, `_show_buff_apply` calls, `_on_minion_siphon_healed`); the [presenter] allowlist is down to UI refreshes, `_silent_buff_apply` and `_on_ritual_firing` (capture only). **Live input (3.4):** `_try_play_spell / _apply_targeted_spell / on_enemy_hero_spell_input` → `cmd_play_spell` (Rally's modal choice resolved first), `_try_play_trap` → `cmd_play_trap`, `_try_play_environment` → `cmd_play_environment`, `_try_play_minion_animated` → plan check, pop the hand visual (`presenter.register_flight`), `cmd_play_minion` (a refusal returns the card to the hand), attacks → `cmd_attack` / `cmd_attack_hero`. **Enemy (3.4):** `EnemyAI.run_turn` drives a `StateAgent(\"enemy\", LivePacer)`, ends with `cmd_end_turn(\"enemy\")`; its 7 signals, executors (`commit_*`, `do_attack_*`, `_pay_for`, `consume_minion`, `find_empty_slot`, `pick_player_target`, `_wait_for_death_vfx`) and `enemies/ai/EnemyAgent.gd` are deleted; the scene's enemy handlers (`_on_enemy_minion_summoned`, `_enemy_summon_reveal_then_land`, `_on_enemy_spell_cast`, `_on_enemy_about_to_attack`, `_on_enemy_attacking_hero`, `_on_enemy_trap_placed`, `_on_enemy_environment_placed`, `_on_attack_resolved`) with them. **Deleted from the scene:** the spell-popup capture (`_capturing_spell_popups`, `_pending_spell_popups` / `_pending_hero_popups` / `_pending_corruption_apply`, both drains), the deferred-death queue (`_deferred_death_slots`, `_flush_deferred_deaths`, `_flush_deferred_death_for`, the sacrifice-unfreeze trim), immediate slot mirroring (`_on_slot_changed`), the 11 state-signal UI subscriptions and their `_on_state_*` wrappers, the TurnManager draw / resource relays, `_sweep_dead_minions`, the enemy-turn gate loop in `_do_end_turn` and `_on_turn_started` (both wait for `presenter.pump_and_wait_idle()`), the sacrifice-bus subscription (the presenter calls `_on_sacrifice_occurred` at MINION_SACRIFICED). 3.0 leftover fixed: Void Netter's net VFX dealt its 200 damage at impact in live (the card's on-play step deals it on both shells now; the VFX is visual); the ACP champion's detonation still passed the old callback. CombatScene 4516 → 3511 lines. LiveSmoke: `_drain` / teardown wait on the presenter and assert the journal is fully played. Interim: the old VFX gate variables are still set by the bridge (the presenter awaits `on_play_vfx_done` for detonations and rune placements) until 3.3; Cyclone and the Seris skills stay inline; no ChoiceModal cancel. run_checks green (1109/1109, load_all 200, lint 0, LiveSmoke OK).\n- 2026-09-24: **3.3 — VFX gates deleted.** `CombatScene` loses `_enemy_summon_reveal_active` / `enemy_summon_reveal_done`, `_enemy_spell_cast_active` / `enemy_spell_cast_done`, the ref-counted `_on_play_vfx_active` / `on_play_vfx_done` gate (+ `acquire/release_play_vfx_gate`), `_active_death_anims` / `death_anims_done`, `vfx_gate` (`combat/effects/vfx/VfxGate.gd` deleted), `_wait_for_rune_placement_vfx` (+ its timeout const). The bridge's detonations, Feral Reinforcement, Brood Call portal, rune placement and the ritual sequence are plain awaitables (no gate writes, no `_clear_play_gate`); `animate_minion_death` no longer counts; the enemy reveal no longer flags. The presenter awaits `_play_corruption_detonations` and `play_rune_placement_vfx` directly; `_run_ritual_visual` no longer polls for the placement halo (RUNE_PLACED plays before RITUAL_FIRED). 3.7 gate: the scene's play adapters are `_command_play_spell / _trap / _environment / _minion` (no `func _try_play_` left; no `EnemyAgent`). 3.3 gate grep → 0. run_checks green (1109/1109, load_all 199, lint 0, LiveSmoke OK).\n- 2026-09-24: **3.5 — tests and lint L8; Cyclone on the command.** Lint **L8** (enforced): no `BuffSystem.apply*`, `SlotState.place(`, `combat_manager.`, `trigger_manager.fire`, `EffectResolver.run`, `state.<field> =`, board `append` / `erase` or `current_health` writes in `combat/effects/*VFX.gd`, `combat/effects/vfx/*.gd`, `combat/ui/*.gd` (CheatPanel exempt) or `BoardSlot` / `CombatPresenter` / `CombatUI` / `CombatInputHandler` / `TrapEnvDisplay` / `LargePreview` / `Targeting` / `CounterWarning`. It flagged one site — the Cyclone dispel — which now goes through `cmd_play_spell(\"player\", inst, chosen trap / environment)` (the card's own DESTROY step removes it; the old inline removal + trigger fire is gone). `LiveSmokeTests._ai_vs_ai_fight`: a whole fight in the real scene — the player a `StateAgent` on the default player profile, the enemy the scene's `EnemyAI`, `presenter.instant = true`; asserts a winner within 90 s, the presenter idle and the journal fully played. `LivePacer`'s beat scales with `BaseVfx.time_scale` so the smoke runs fast. TESTING (L8 row, LiveSmoke description), ARCHITECTURE and the plan header updated. run_checks green.\n- 2026-09-24: **Handoff.** Phase 3 is done through 3.5 (ten commits, 0.630–0.639); 3.7's gates are green (`run_checks.sh` with L1–L8, 1109/1109 + LiveSmoke incl. the AI-vs-AI fight; `class_name EnemyAgent` / `func _try_play_` / the gate names all grep to 0). **Open: 3.6 — owner visual QA** (blocks Phase 4): (1) F1 Feral Pack — card flight, enemy reveal, attack lunge, death ghost, buff pulse; (2) a Seris fight — sacrifice sequence (the ghost now rises after MINION_VISIBLE + fade, timing untuned), flesh counter, corruption detonation; (3) F15 — phase transition; (4) any ritual — rune placement halo then ritual fire (RUNE_PLACED plays before RITUAL_FIRED; the player's Demon Ascendant no longer fires its projectile tail); (5) Void Bolt projectile then HP drop; (6) Smoke Veil cancels the attack that triggered it; (7) a Korrath fight — Rally modal (no cancel path yet); plus the enemy ritual sacrifice (sequence plays after the inline resolution; the demon's sigil is sequenced by the presenter) and buff label holds (`hold_stats` → tween at the pulse). Visual regressions are fixed in `CombatPresenter._play` / the scene's animation bodies, never by mutating in VFX (L8). Also open: the Seris skills as direct state calls (`cmd_hero_skill` exists), ChoiceModal cancel, EnemyAI → EnemyTurnRunner rename / resource-forwarder removal (Phase 4).\n- 2026-09-25: owner chose to start Phase 4 (task 044) with 3.6 visual QA still open; the task stays active until the QA pass is done.\n\n## Summary\n\n_(filled in at /task-done)_"}, {"id": "\"044\"", "title": "Live/sim unification — Phase 4", "status": "done", "area": "combat", "priority": "normal", "started": "2026-09-25", "finished": "2026-09-25", "file": "044-live-sim-unification-phase-4.md", "body": "## Description\n\nPhase 4 of `design/refactors/LIVE_SIM_UNIFICATION_PLAN.md`: collapse the remaining live/sim duplicates now that both shells run on `CombatState` commands — one `CombatConfig` + `setup_combat` path (4.1), diagnostics off `SimState` and `SimState` deleted (4.2), one `CombatSetup` (4.3), the scene forwarders / delegates / `ctx.scene` / `TurnManager` deleted (4.4), the deletions checklist (4.6) and docs (4.7). 4.5 (the D6 file split) waits for the Phase 5 parity test. Started with 3.6 (owner visual QA) still open, at the owner's call.\n\n## Work log\n\n- 2026-09-25: opened. Baseline `tools/run_checks.sh` at `79508c2`: green, 1109/1109, lint 0 (L1–L8), load_all 199, LiveSmoke OK (AI-vs-AI fight: enemy wins, turn 5, 256 events). 3.6 visual QA deferred by the owner; Phase 4 does not touch presenter code, so regressions found later are still fixed in `CombatPresenter`.\n- 2026-09-25: **4.1–4.3 (+4.2) — one setup path; SimState and SimTriggerSetup deleted.** New `combat/board/CombatConfig.gd` (decks, HP, hero, talents, hero / enemy passives, enemy + player profile ids, limited cards, relics, seed; `from_game_manager()` — consumes `GameManager.next_combat_seed` — and `from_dict(d, seed)` for CombatSim's JSON-safe config / replay records). `CombatState.setup_combat(config)`: seed → heroes / passives → override cache → HP → decks (player, then enemy + its 5) → CombatManager (+ its three signal connections) → HardcodedEffects → player's opening 3 → `CombatSetup.setup(self)` → ancient_frenzy's Pack Frenzy → relics (only when there are any). `CombatSetup.setup(state)` is static and owns the whole trigger setup (fresh TriggerManager + CombatHandlers on the state, trap routes first, the BuffSystem corruption bus bridge, always-on handlers, registry); `apply_passive(id, state)`. `CombatState._on_corruption_removed_bus` is live's body (hero targets journal HERO_BUFF_CHANGED; minions refresh) and `teardown()` disconnects it and resets both MinionInstance globals. `enemy_passives` / `_active_enemy_passives` collapsed into `enemy_passives`; `enemy_profile_id` + `enemy_profile_changed` on the state: `PhaseTransition` is typed on `CombatState` (no duck typing), swaps the profile id and emits; EnemyAI and CombatSim rebuild their enemy profile on the signal (sim keeps it in a shared `enemy` dict); the \"Sovereign reawakens\" line is a state log. Live `_ready`: `state.setup_combat(CombatConfig.from_game_manager())` before the presenter, UI after, `state.start_combat()` last; deleted `_setup_triggers`, `_connect_combat_manager`, `_connect_buff_signal`, `_on_corruption_removed`, `_connect_sacrifice_signal`, `_play_phase2_vfx`, TurnManager.start_combat's call. Cheat panel: talent unlock re-runs `CombatSetup.setup(state)`; relic grant rebuilds the runtime then the bar. **4.2:** `sim/CombatDiagnostics.gd` (damage-to-enemy log incl. Void Bolt's split log, debug print; `state.diagnostics`, null live); `dmg_log*`, `turn_snapshot_callback` (now CombatSim's own), `debug_log_enabled` (profiles read `state.diagnostics`) off the state; `sim/SimState.gd` deleted — CombatSim, TestHarness (`build_state` → a `CombatConfig` + `setup_combat`) and every test/debug tool use `CombatState`. Lint: L5 is now \"nothing extends CombatState\"; L1/L6 drop SimState. **Live behaviour changes:** triggers and relics are registered before turn 1 begins (live used to register them after `start_combat`, so turn-1 ON_PLAYER_TURN_START / the turn-1 draw's ON_PLAYER_CARD_DRAWN had no listeners — sim order now); the player deck shuffles before the enemy's (same seed → different live shuffle than before); a fight launched without an encounter has 2000 enemy HP instead of 0. **Sim behaviour change:** ancient_frenzy's opening Pack Frenzy now reaches the sim (live always had it) — Act 1 batch (200 runs, seed 7; `044-balance/bal_42_act1.txt`) vs `042-balance/bal_post2a_act1.txt`: only F3 Imp Matriarch moves, −3 to −19 pts per deck/variant (e.g. Swarm 87/85.5/86.5 → 82.5/79/81.5, DeathCircle f3_c 53 → 40, S.Forge f3_b 60.5 → 46); every other row byte-identical; Act 2 (`bal_42_act2.txt`) byte-identical to `bal_post2a_act2.txt`. Deviations: 4.1–4.3 land as one commit (setup, triggers and SimState are one seam); the `_debug_*` counters stay with the other diagnostic counters on the state; `CombatConfig.from_encounter` is `from_dict` (the sim config dict is already keyed by encounter profile). run_checks green (1109/1109, load_all 199, lint 0, LiveSmoke OK).\n- 2026-09-25: **4.4a — rules code has no shell and no presenter.** `CombatState.presenter`, `_get_scene_facade()` and the `state` self-alias are deleted; `EffectContext.scene` / `.presenter` → a typed `state: CombatState` field (`EffectContext.make(state, owner)`); `CombatHandlers` / `HardcodedEffects` / `RelicEffects.setup(state)` (their `_scene` and `presenter` members are gone); `CombatManager.scene` → a typed `state` (set by `setup_combat`); the agents' `scene` getter is gone (profiles guard on `agent.state`). The last presenter calls became journal events — new kinds `HAND_COSTS_CHANGED` (Fiendish Pact / its consume, MOD_LAST_ADDED_COST, MOD_HAND_CARDS_COST), `SPELL_COUNTER_CHANGED` (COUNTER_SPELL arms a charge; replaces the enemy on-play `_update_counter_warning` call), `CHAMPION_PROGRESS`, `CHAMPION_KILLED`; Void Echo's copy journals `CARD_GENERATED` (+ `card_generated`) instead of touching `hand_display`; `_silent_buff_apply` is a state field; `RITUAL_FIRED` carries `slots` (pick order) and `runes`, so the scene's `_on_ritual_firing` / `_pending_ritual_capture` / `_pick_player_ritual_rune_indices` (a copy of the engine's pick loop) are deleted and `_capture_ritual_visual(slots, runes)` builds the merge VFX at playback; the Pack Instinct chain / buff VFX events no longer depend on a presenter existing (sim journals them too). Duck-typed writes made typed: COUNTER_SPELL / TAX_OPPONENT_SPELLS_NEXT_TURN, Fiendish Pact, Captain's Orders and crit-consumed counters, the crit multiplier (`player_crit_multiplier` never existed — player crits always used the global), the Behemoth / Bastion death log. `HandDisplay.refresh_condition_glows` builds its context from `scene.state`. **Lint:** L1 = no `_scene` / `ctx.scene` / `_fx` / `scene.` in rules code (now also CombatState, CombatSetup, EffectContext, PhaseTransition); L3 = no `presenter` there at all; `presentation_allowlist.txt` and `l1_allow.txt` deleted (verified by a probe line that trips L1, L3 and L4). Balance: Acts 1–2 byte-identical to the 4.1–4.3 run. run_checks green (1109/1109, load_all 199, lint 0, LiveSmoke OK).\n- 2026-09-25: **4.4b — forwarders, delegates, TurnManager and EnemyAI's façade deleted; CombatScene 3400 → 1936 lines.** A code-aware rewrite (strings and comments untouched) removed CombatScene's 102 `get: return state.X` forwarders and its 38 one-line pass-through delegates to the state (`_log`, `_card_for`, `_refresh_slot_for`, `_spell_dmg`, `_friendly_board`, …); every read in the scene became `state.X` and in the UI helpers `_scene.state.X` (CombatInputHandler, CombatUI, Targeting, TrapEnvDisplay, LargePreview, CounterWarning, PipBar, SerisResourceBar, EnemyHeroPanel, CheatPanel, CombatVFXBridge, VfxController, LiveSmoke); PipBar / SerisResourceBar's `_scene.get(\"player_flesh\")`-style duck reads are typed. `--report-pairs` (now implemented in the lint) → 0. **TurnManager deleted** (script, node, `state.turn_manager`): the UI reads `state.player_essence` etc., the scene subscribes to `state.turn_started` / `turn_ended`, end turn is `state.cmd_end_turn(\"player\", growth)` (so live end-turns are in `command_log` too), the test config uses `state.emit_resources`. **EnemyAI → `EnemyTurnRunner`** (file, class, node; scene var `enemy_turn`): only `ai_profile`, `run_turn`, `grow_at_turn_start` remain — its 20 enemy-side forwarders are gone (readers use `state.enemy_*`), the fallback deck lives on CombatConfig. The Seris skill buttons go through `cmd_hero_skill` (Soul Forge button, Corrupt Flesh target pick) instead of calling the state bodies. Dead code removed from the scene: 16 unreferenced funcs (e.g. `_on_minion_siphon_healed`, `_pay_card_cost`, `_play_ritual_sacrifice_sequence`, `_on_trap_env_input`, `_summon_soul_rune_spirit`) and `_enemy_panel_bg`. Moved off the scene: panel styles + hero-panel tooltips → new `combat/ui/CombatUiStyle.gd` (static `create_stylebox` / `apply_slot_style` / `apply_empty_slot` replace three duplicate `_create_stylebox` copies in PlayerHeroPanel, EnemyHeroPanel and PipBar; `scene.ui_style` builds the tooltips); Pack Instinct chain / ATK pulse, lifedrain pulse and the Void Rune projectile origin → CombatVFXBridge (the rune rotation index moved off the state — it was presentation). **Lint L9** (enforced): no `has_method(` and no `.get/.set(\"x\")` / `\"x\" in` on an object handle in combat/board, combat/events, combat/effects (VFX exempt), relics, sim, enemies/ai — receiver-based (Dictionary `.get` is fine, as in L4); fixed its three hits (two `has_method` guards on typed BoardSlots, ScreenShakeEffect's `position` via typed Control / Node2D helpers). Balance: Act 1 byte-identical. run_checks green (1109/1109, load_all 199, lint 0 with L1–L9, LiveSmoke OK).\n- 2026-09-25: **4.6 + 4.7 — deletions and docs; 4.8 gates green.** Deleted `combat/effects/BroodCallVFX.gd`, `corruption_bloom.gdshader`, `plague_cloud.gdshader` (+ uids; unreferenced by name or uid); `COMBAT_STATE_MANIFEST.md` → `design/refactors/archive/`. ARCHITECTURE: file-finder (CombatConfig, journal/presenter, EnemyTurnRunner, no SimState/SimTriggerSetup/TurnManager), `EscMenu` in the autoload table, \"Combat architecture\" rewritten as engine / drivers / presentation, the CombatScene section (no forwarders, no gate signals), sub-system and UI tables (CombatConfig, EnemyTurnRunner, CombatUiStyle, ChoiceModal), effect / trigger / simulation sections (`setup_combat`, `CombatSetup.setup(state)`, CombatDiagnostics, SimRelicPolicy), buff flow via `BUFF_APPLIED`, invariants 1 / 4 / 9 / 11. CLAUDE.md \"Adding New Trigger Handlers\": register in `CombatSetup.setup(state)`, journal events instead of presenter calls, L1–L9, run_checks green before a version commit. TESTING.md: lint table (L1 / L3 / L5 rewritten, L9 added), no SimState, the nonexistent `tools/baseline` section and its workflow steps replaced by run_checks + a seeded batch diff. Plan header: Phase 4 done with deviations. Gates: run_checks green (1109/1109, load_all 198, lint 0 with L1–L9, LiveSmoke OK); `--report-pairs` 0; `grep SimState` 0; the 4.4 grep (`ctx.scene` / `_scene_facade` / `.presenter` in effects, events, relics) 0; CombatScene 1,931 lines; `sim/` = CombatSim, CombatDiagnostics, SimRelicPolicy.\n- 2026-09-25: closed.\n\n## Summary\n\nPhase 4 shipped in four commits (0.640–0.643). Every fight, live or sim or test, is now built by `CombatState.setup_combat(CombatConfig)` with one `CombatSetup.setup(state)`. SimState, SimTriggerSetup and TurnManager are deleted, EnemyAI became the stateless `EnemyTurnRunner`, and rules code holds no shell or presenter: the last UI calls became journal events. CombatScene lost its 102 forwarders and 38 delegates (3,400 → 1,931 lines), and lint gained L9 (no duck typing) and a working `--report-pairs`. The sim now gives the enemy ancient_frenzy's opening Pack Frenzy, which live already did, so F3 moved −3 to −19 points; every other batch row is byte-identical.\nFollow-ups: 3.6 owner visual QA (task 043 still open); Phase 5 parity test and live smoke matrix, then 4.5 (the D6 file split); the F15 forced end of the player's turn is still issued by the presenter (the sim doesn't end the turn); ChoiceModal cancel; F3 may need retuning after the Pack Frenzy change."}, {"id": "\"045\"", "title": "Live/sim unification — Phase 5", "status": "done", "area": "combat", "priority": "normal", "started": "2026-09-25", "finished": "2026-09-25", "file": "045-live-sim-unification-phase-5.md", "body": "## Description\n\nVerify the Phase 4 gates of `design/refactors/LIVE_SIM_UNIFICATION_PLAN.md`, then build Phase 5's tripwires: a parity test that replays an engine-only fight through the live CombatScene and compares state digests after every command (5.1), an AI-vs-AI live smoke run for every Act 1 encounter (5.2), the final lint set (5.3) and its wiring into run_checks and the docs (5.4).\n\n## Work log\n\n- 2026-09-25: opened. Phase 4 verification at `be36a94`: `tools/run_checks.sh` green (lint 0, load_all 198, 1109/1109, LiveSmoke OK: AI-vs-AI fight, enemy wins on turn 4 with 175 events). Grep gates hold: no `SimState`; no `ctx.scene` / `_scene_facade` / `.presenter` in effects, events or relics; `--report-pairs` 0; zero `await` in the rules files; no 3.3 gate flags in code; `sim/` holds only CombatSim, CombatDiagnostics and SimRelicPolicy; CombatScene is 1,931 lines; the 4.6 deletions are done and the manifest is archived. Leftovers: stale doc comments in CombatVFXBridge (`:137-138, 181, 226, 281, 1120`) and CombatScene (`:1713`) still name the deleted gate flags.\n- 2026-09-25: **5.0 — engine fixes found while building parity.** (a) The F15 forced end of the player's turn moved into the engine: every `cmd_*` is a thin wrapper `_finish_command(_cmd_*(...))`; a P1 → P2 transition during the player's turn sets `_transition_ends_player_turn` and the command that caused it ends the turn (end_turn + begin_turn(\"enemy\")). The presenter no longer issues `cmd_end_turn` at PHASE_TRANSITION (it was skipped entirely under `presenter.instant`); `_force_end_player_turn_for_phase_transition` is gone, its selection cleanup is in `_on_turn_ended`. Sim now ends the turn too — F15 batch (200 runs, seed 7): mean −1.0 pt, rows −5.5 to +1.0 (Voidbolt −3 to −5.5), `045-balance/bal_f15_before.txt` / `bal_f15_after_forced_end.txt`; Acts 1–2 byte-identical. (b) `EnemyTurnRunner` keeps one StateAgent across the F15 profile swap (live used to reseed `decision_rng`; the sim keeps its agent). (c) The 0.4 s beat before the live enemy turn scales with `BaseVfx.time_scale`. (d) Stale comments naming the deleted gate flags / deferred-death machinery rewritten (CombatVFXBridge, CombatScene, VfxController header).\n- 2026-09-25: **Live bugs the parity test found.** (1) `CombatInputHandler.begin_spell_select / begin_minion_select` called `_scene._player_can_afford_sparks`, deleted in 0.617 — every affordable spell / minion selection in the live game errored and did nothing since Phase 1.4 → `state.can_afford_sparks(\"player\", …)`. (2) `PhaseTransition._wipe_boards_silently` wrote `slot.minion = null`, so the live slot views kept showing the banished minions and the input layer saw a full board (no minion plays in F15 Phase 2) → `slot.clear()` (journals SLOT_CHANGED). (3) `cmd_play_minion` appended the minion to the board after ON_*_MINION_PLAYED even if its on-play had banished it (Void Imp ending F15 P1) or killed it — a board minion with no slot → skip the append when the slot no longer holds it. (4) Live enemy AI nondeterminism: after the first awaited action inside a profile's attack loop, the loop sometimes skips the remaining minions (enemy stops attacking mid-turn). Probe: in one iteration with no await between them, `has(m) and can_attack()` counted 3 able minions while the `if not has(m) or not can_attack(): continue` right after let 1 through — the GDScript coroutine resume misbehaves (couldn't reproduce in a 1,600-iteration minimal script). F6: 4 of 18 loaded runs fail with LivePacer at Engine.time_scale 10, 1 of 18 at 1.0, 0 of 18 with the base (synchronous) Pacer. Open — needs an owner call.\n- 2026-09-25: **5.1 / 5.2 — parity test.** `debug/tests/ParityTests.gd` + `Parity.tscn`: 8 cases (F1 swarm, F2 voidbolt, F3 death_circle, F4 Seris corrupt, F5 Seris forge, F6 Korrath, F13, F15; relic pairs on four) × seeds 11/22/33. Engine run via `CombatSim.run` with a new `state_observer` hook and `CombatState.command_recorded(index)`; live replay drives the player through the scene's input entry points (hand select, slot / hero clicks, trap / env clicks, relic bar + Blood Chalice targeting, Seris skill buttons, end turn), the enemy is the live EnemyTurnRunner; the player grows by the sim's profile curve. Compares records + digests per command and the final digest; asserts a winner and a fully played journal (5.2 — F1–F3 are every Act 1 encounter). AI-only moves issued directly and tallied: `minion_skipped_mandatory_target:grafted_butcher` 3, `minion_target_ui_cannot_pick:soul_collector` 2, `spell_random_target:flesh_rend` 3. `digest_text` gains the board arrays with slot_index. `CombatSim.decode_target` public. Runtime 29 s (Engine.time_scale 10 in the scene). LiveSmoke's AI-vs-AI fight is seeded (7) and the player grows by the profile curve.\n- 2026-09-25: **5.3 / 5.4 — lint and wiring.** L10 (`await get_tree().create_timer` in *VFX.gd ≤ 20) and L11 (names reached through an untyped scene handle must be declared on CombatScene / CombatState — flags the `_player_can_afford_sparks` bug when reintroduced). run_checks runs Parity; `tools/hooks/pre-push` sample; TESTING.md (Parity section, L10/L11, gate time), CLAUDE.md (gate description, L1–L11), `/task-done` note. Verification finding: plan 3.3's input gate (player commands only when the presenter is idle) was never implemented.\n- 2026-09-25: committed 0.644 (5.0 fixes) and 0.645 (parity, lint, docs) — gate green.\n- 2026-09-25: **Owner decision: synchronous enemy turn, presenter paces (fixes live bug 4).** `EnemyTurnRunner` runs the profile on one StateAgent with the base Pacer — play phase, attack phase, `cmd_end_turn(\"enemy\")` resolve at once, as in the sim; `LivePacer` deleted. Every accepted command journals `CombatEvent.Kind.COMMAND` (also a look-ahead stop); `CombatPresenter._pace_command` plays a 0.55 s beat before each enemy action after the first (none after spark fuel) and one more before its first attack. The scene's turn-start UI moved to TURN_STARTED playback (`show_turn_started`); `_on_turn_started` only kicks off the enemy after the presenter is idle + 0.4 s. Input gate `CombatScene.player_can_act()` (engine says player turn, presenter has shown it, no end turn in flight) on hand select, slot / hero clicks, relic bar, Seris skills — lighter than 3.3's \"presenter idle\" so players keep acting during their own animations. LiveSmoke's seeded fight also seeds the deck-variant pick; it now repeats exactly (551 events × 3). Parity 12 / 12 full runs green under 6× parallel load (was ~4 / 18 F6 failures). Balance unaffected (sim untouched). ARCHITECTURE and the plan updated (Phase 5 done, deviations).\n- 2026-09-25: closed.\n\n## Summary\n\nPhase 5 shipped in three commits (0.644–0.646), with `tools/run_checks.sh` green before each. The new parity test (`debug/tests/Parity.tscn`) plays 8 fights × 3 seeds on the engine, replays each through the live scene's input handlers, and compares state after every command. Building it exposed five live-only bugs, all fixed:\n- Every spell or minion selection had errored since 0.617.\n- The F15 banish left the slot views full.\n- `cmd_play_minion` re-added a minion its own on-play had banished or killed.\n- The F15 forced end turn was issued by the presenter; it now happens in the engine.\n- An `await`-in-loop GDScript misbehaviour made the enemy stop attacking. The live enemy now decides its turn synchronously and the presenter paces it.\n\nLint gained L10 and L11; F15 balance moved −1.0 pt.\nFollow-ups: 3.6 owner visual QA (now incl. the presenter-paced enemy turn and the `player_can_act` input gate); optional 4.5 file split; ChoiceModal cancel; missing asset `void_ritualist_portrait.png` (F5 load error); sim-fidelity signal — the AI makes moves a player can't (skipped mandatory target on grafted_butcher, UI-illegal soul_collector target, random-target flesh_rend); the sim's Abyssal Mandate reads the growth pick one turn later than live (player growth is a turn-start curve in sim) — owner call."}, {"id": "\"046\"", "title": "Minion HP labels driven by journal events, not live state", "status": "done", "area": "ui", "priority": "normal", "started": "2026-09-25", "finished": "2026-09-25", "file": "046-minion-hp-labels-journal-events.md", "body": "## Description\n\nBoard slot ATK / HP labels snap to the live engine values whenever a slot refreshes, but the engine resolves a whole enemy turn before the presenter plays it, so an enemy rush minion (and the minion it hits) shows post-attack HP the moment it is summoned. Make the labels a lagging view: summon / slot events carry the minion's stats at emit time, damage / heal / buff / stats-changed events update the shown values as they play, and the attack lunge tweens between the event's before / after values instead of reconstructing from live HP.\n\n## Work log\n\n- 2026-09-25: opened.\n- 2026-09-25: summon / slot / stats events carry a stat snapshot (`CombatState.minion_stat_payload`); BoardSlot labels render `shown_atk / shown_hp / shown_shield`; damage / heal / buff events move them (tween re-targets when a newer value arrives); the lunge tweens from the DAMAGE_DEALT before / after values, no longer `state._refresh_slot_for` from the scene; the presenter's `_ahead` guard keeps early-shown HP from being rewound by older snapshots. LiveSmoke probe `_hp_labels_lag_the_engine` (task 046).\n- 2026-09-25: closed.\n\n## Summary\n\nBoard slot ATK / HP labels no longer read the live minion: they render the slot's own `shown_atk / shown_hp / shown_shield`, seeded from a stat snapshot the summon / slot / stats-changed events now carry (`CombatState.minion_stat_payload`) and moved only by damage / heal / buff events as the presenter plays them. The attack lunge tweens from the DAMAGE_DEALT before / after values (the scene no longer calls `state._refresh_slot_for`), a label tween re-targets when a newer value arrives, and the presenter's `_ahead` guard keeps an HP shown early by the look-ahead from being rewound by an older snapshot journaled before it. LiveSmoke gained `_hp_labels_lag_the_engine`; run_checks.sh green (1109 tests, LiveSmoke, Parity 24/24).\nFollow-ups: status icons / shield frame / buff glow still read the live minion on refresh; the enemy-turn visual pass (plan 3.6) should confirm the rush case by eye."}, {"id": "\"047\"", "title": "Move enemy decks from user:// into the repo", "status": "backlog", "area": "content", "priority": "high", "started": "", "finished": "", "file": "047-enemy-decks-into-repo.md", "body": "## Description\n\nFound in the 2026-09-25 architecture review (issue 1 of 9). Re-verified 2026-09-30 at `3009a60`. Line numbers are from that commit.\n\nAll enemy deck data lives only in `user://encounter_decks.json` (`EncounterDecks.SAVE_PATH`, `enemies/data/EncounterDecks.gd:23`). **There is no copy in git.** On the dev Mac the file is `~/Library/Application Support/Godot/app_userdata/Echo of Abyss/encounter_decks.json` (8581 B, mtime 2026-04-29, CRLF line endings). It holds:\n- 23 decks. Pools F1–F15: F1–F3 have 3 decks each, F4 has 2, F5–F15 have 1.\n- 7 per-deck `ai_profile` overrides.\n- `limited: [\"void_wind\"]` on f8_a–f11_a.\n- `f15_p2`, the Sovereign phase-2 deck, which is in no pool.\n\nReaders:\n- **Live:** `GameManager.get_encounter` (`GameManager.gd:244-260`), called from `start_new_run` (:88), `advance_node` (:117), `UserProfile.gd:85` (load) and `CheatPanel.gd:354` / `:373`.\n- **Rules code:** `PhaseTransition.gd:70` (`SOVEREIGN_P2_DECK_ID`, :19). The file's `ai_profile` for f15_p2 is ignored; phase 2 hard-codes its profile at :20.\n- **Sim and balance:** `BalanceSimBatch.gd:256-278`, `BalanceSim.gd:267`, `:600`, `:603`, `DebugSingleSim.gd:13-14`, `DebugF13LossAnalysis.gd:34-35`.\n- **Tests:** Parity (through `get_encounter`, `ParityTests.gd:195`), `ScenarioTests.gd:77-78` and `:127`, `LiveSmokeTests.gd:237`.\n- **Legacy:** `MapScene.gd:63`, `:136`. MapScene is no longer in the scene flow.\n- **Writer:** `debug/EnemyDeckBuilder` is a runtime debug scene opened from `BalanceSim.gd:256`, not an editor tool. It writes through `EncounterDecks.save_deck` / `add_to_pool` / `set_deck_profile` → `save_data`.\n\nWhat breaks without the file (fresh clone, another machine, an exported build):\n- **It fails silently.** `load_data()` returns `{\"pools\": {}, \"decks\": {}}` with no message when the file is missing (:30-31), won't open (:33-34), won't parse (:36-37) or isn't a dict (:46). `save_data` also fails silently (:49-51).\n- **Live** falls back to `CombatConfig.FALLBACK_ENEMY_DECK` (`CombatConfig.gd:12`, applied at :60). The F15 phase-2 deck is empty, and the variant AI profiles can't be reached.\n- **The sim has no fallback** and gets `[]`. BalanceSimBatch logs `push_warning` and skips every fight (:257-259).\n- **The gate fails.** `ScenarioTests.gd:127-128` asserts that `f1_a` is non-empty. Parity's engine run gets `[]` while live gets the fallback deck, so the two diverge.\n- **Balance numbers depend on one machine's file.**\n\nDeck pick: `EncounterDecks.gd:134` and `:142` use the global `randi()`, not the engine RNG. Lint L2's scope (`tools/lint/lint_engine.py:140-147`) doesn't include `enemies/data/`, so it never flags these calls. Parity and LiveSmoke work around this by calling `seed()` before `get_encounter` (ParityTests:185-187, LiveSmokeTests:200-203).\n\nExisting data-loss bug: `save_deck` (:160-174) and `set_deck_profile` (:177-186) drop a deck's `limited` field. Editing F8–F11 in the builder strips `void_wind`. Once the file is in git, that becomes a silent content regression.\n\n## Decision (owner, 2026-09-30)\n\n- **The Mac copy is canonical.** Every test and balance run on this machine has read it since April. A byte-identical backup, with the timestamp kept, is at `~/Documents/Personal/echoofabyss_backup/encounter_decks_2026-09-30.json`.\n\n## Proposed fix\n\n1. ~~Back up the current file.~~ Done 2026-09-30 (see Decision).\n2. Commit the Mac copy as `res://enemies/data/encounter_decks.json` with LF endings, and make it the only source `EncounterDecks.load_data()` reads.\n   - Drop the user:// layer. A stale local file would shadow the repo copy and keep results machine-dependent.\n   - Delete the local file after the move.\n3. Point EnemyDeckBuilder's writes at the res:// file. This works in editor runs only, because res:// is read-only in an export. Fix `save_deck` / `set_deck_profile` so they keep `limited`.\n4. Make a missing or unparseable file loud with `push_error`. The gate greps only `SCRIPT ERROR`, so the step 6 test is what actually catches it.\n5. Make the deck pick reproducible from a seed:\n   - Add a run seed (`GameManager.run_seed`), set in `start_new_run` before its `get_encounter(1)`.\n   - Pick without stored RNG state, e.g. index = `hash([run_seed, encounter_index]) % pool.size()`.\n   - Don't use `next_combat_seed`: it is -1 until combat start (`CombatConfig.gd:63-66`), which is after the deck is picked.\n   - Don't use a stateful run RNG either: `get_encounter` is also called for display (CheatPanel loops all 15 fights), which would advance it.\n   - Parity and LiveSmoke set the run seed instead of calling `seed()`.\n   - Replace `BalanceSim.gd:603`'s `pick_random`.\n   - Add `EncounterDecks.gd` to L2's `RNG_FILES`.\n6. Content test, in ScenarioTests or a new check:\n   - every pool F1–F15 is non-empty;\n   - every deck card id and every `limited` id is in `CardDatabase.get_all_card_ids()` (`get_card` calls `push_error` on unknown ids, so don't probe with it);\n   - every `ai_profile` passes `ProfileRegistry.has_profile(\"enemy\", id)` (`make()` silently falls back to \"default\");\n   - `PhaseTransition.SOVEREIGN_P2_DECK_ID` resolves to a non-empty deck.\n7. Optional: cache the parsed file. `load_data()` re-reads and parses it on every query: 4 times per `get_encounter`, plus once inside rules code at the F15 transition. `save_data` clears the cache.\n8. Docs: `ARCHITECTURE.md:32` and `:241`, the `EncounterDecks.gd:6` header comment, `TESTING.md`.\n\n## Verification\n\n- With no user:// file present: live, sim, Parity, ScenarioTests and BalanceSimBatch all get real decks.\n- `tools/run_checks.sh` green.\n- BalanceSimBatch:\n  - Steps 1–4 change nothing. On this machine the sim already reads this exact file, so a byte-identical move is neutral.\n  - Step 5 changes which variant BalanceSim.gd and live play pick. BalanceSimBatch iterates every variant, so it should stay unchanged.\n  - Parity and LiveSmoke stay green but may exercise different variants. Record that.\n- First export: check the JSON is packed. Godot 4 should include `.json` files. No export preset exists yet; task 053 decides on one.\n\n## Related\n\n- 052 saves the chosen deck id and the run seed with the run. Do 047 first.\n- Roadmap H3 would move the phase-2 deck spec into `EncounterTable`.\n\n## Work log\n\n- 2026-09-25: opened from the architecture review. Verified: no `encounter_decks.json` in `git ls-files`; `load_data()` returns empty pools when the file is missing.\n- 2026-09-30: re-verified at `3009a60` and rewritten.\n  - Without the file the gate fails (ScenarioTests, Parity) and the sim skips fights. It does not silently pass.\n  - `next_combat_seed` can't seed the pick; replaced with a run seed and a stateless pick.\n  - EnemyDeckBuilder is a runtime debug scene, not an editor tool.\n  - Completed the reader list.\n  - Added the `limited`-field data-loss bug.\n  - Extended the test to `limited` ids and f15_p2.\n- 2026-09-30: owner decision: the Mac copy is canonical. Backed it up outside user://."}, {"id": "\"048\"", "title": "Stop the presenter from soft-locking combat on a stuck animation", "status": "backlog", "area": "ui", "priority": "normal", "started": "", "finished": "", "file": "048-presenter-softlock-guard.md", "body": "## Description\n\nFound in the 2026-09-25 architecture review (issue 2 of 9). Re-verified 2026-09-30 at `3009a60`. Line numbers are from that commit.\n\n**Nothing here hangs in normal play today.** This is a guard against the next VFX bug, which would otherwise soft-lock the game.\n\n`CombatPresenter._drain` (:99-118) does `await _play(ev)` (:111) with no deadline. If an animation's signal never fires:\n- `_draining` stays true, `idle` never emits, and `pump_and_wait_idle()` (:93-96) never returns.\n- `_do_end_turn` leaves `_end_turn_in_progress = true` (CombatScene.gd:470; the await is at :472).\n- The enemy turn never starts (`_on_turn_started` awaits at :398).\n- `player_can_act()` (:427-428) needs both the turn shown and `not _end_turn_in_progress`, so all player input is blocked too.\n\n### Waits that can block a drain\n\n**38 signal awaits:**\n\n| File | Count | Where |\n|---|---|---|\n| CombatPresenter | 3 | :398 `buff_vfx_batch_done`; :427 and :551 `bolt.impact_hit` |\n| CombatScene | 10 | 8 tweens; `vfx.finished` at :1559 and :1710 |\n| VfxController | 7 | :83, :85, :112, :140, :142, :166, :176 |\n| CombatVFXBridge | 18 | 14 VFX signals, 4 tweens |\n\nThe tweens are low risk.\n\n**5 polling loops with no limit:**\n- CombatScene :1484-1485 (`play_trap_reveals`, waits for `shown[0]`);\n- bridge :170-173 (detonations);\n- bridge :435-438 (`tail_done_ref`, set only through the BEAT_MERGE_COMPLETE listener at :427-431);\n- bridge :490-494 and :497-501 (RitualProjectile `finished`).\n\nA sixth, bridge :511-514, is in `play_demon_ascendant_tail_for`, which has no callers.\n\n**One existing deadline:** only `_cast_anim` (:660-665) has one. It is 4 s of wall-clock time (`Time.get_ticks_msec`), so it ignores time scale and keeps counting while the ESC menu pauses the game.\n\n### Latent ways to hang (none reachable today)\n\n1. **A signal fires before anyone awaits it.**\n   - `BaseVfx._ready()` calls `_play()` synchronously (BaseVfx.gd:39-40).\n   - `VfxController.spawn` adds the VFX to `$VfxLayer`, which is in the tree (:48), so `_play` runs inside `add_child`.\n   - 22 of the 29 BaseVfx subclasses have a guard that emits `finished` (and `impact_hit`) immediately, e.g. SummonSigilVFX :106-110.\n   - `CombatVFXBridge.summon_spark_with_sigil` spawns first and only then awaits (:51-53).\n   - Every caller checked validates the guard condition first (e.g. `_play_summon` null-checks the slot at CombatPresenter :314-315). BuffApplyVFX and CorruptionDetonation connect before spawning.\n2. **A spawn is silently skipped.**\n   - `VfxController.spawn` skips `add_child` when `_vfx_layer` is null (:44-48).\n   - Bridge sites spawn only `if vfx_controller != null` but await regardless (:947-950, :958-961).\n   - The void-bolt spawners can return an unspawned bolt (:835-838, :865-868) whose `impact_hit` the presenter awaits.\n   - `play_trap_reveals` waits forever if `vfx_bridge` is null (:1883) or the bridge returns early (:987-991).\n3. **A VFX is freed, or its host leaves the tree, before emitting.** VfxSequence's abort (:111-113, :141-143) emits `finished` but not `impact_hit` or the scheduled mid-phase beats (:155). Today this only happens at teardown.\n4. **A stuck BuffApplyVFX prelude** (`await _prelude.call()`, BuffApplyVFX.gd:140) stalls `buff_vfx_batch_done`.\n\n### Not issues (corrects the original task)\n\n- **The VfxSequence watchdog** (debug builds only, :203) is effectively dead code. Phases run on SceneTreeTimers and nothing inside a sequence is awaited, so a sequence can't stall. Running it in release builds gains nothing.\n- **`VoidBoltProjectile.gd:299`** returns without emitting `finished`, but nobody awaits the bolt's `finished`; the presenter awaits `impact_hit`, which fires at :274. RitualProjectile :303-306 has the same pattern and is polled, but only matters at teardown. Both are hygiene only.\n\n### Test coverage\n\nLiveSmoke already runs four scenarios with animations on, at `BaseVfx.time_scale = 0.05` (:22):\n- the F1 enemy turn;\n- F13;\n- live rules paths;\n- HP labels (exercises the look-ahead).\n\n`run_checks.sh` kills any run after 300 s, so a hang in those paths already fails the gate.\n\nThe gap: Parity (ParityTests:124) and LiveSmoke's AI-vs-AI fight (:206) set `presenter.instant = true`, so no full fight ever plays with real animations.\n\n## Proposed fix\n\nWork in this order. Step 3 carries the design risk and can be split out as 048b.\n\n1. **Make hangs visible first.** Add one full fight with animations on (not the whole Parity matrix). Run it with `Engine.time_scale = 10`, as Parity does, because many waits ignore `BaseVfx.time_scale`. Put a wall-clock limit on it.\n2. **Fix the root causes.**\n   - **Connect before spawning.** Add `VfxController.spawn_and_await(vfx, signal_name, budget)`: it connects first, then calls `add_child`, and returns at once with a warning if the layer is missing.\n     - Alternative: `BaseVfx._ready` → `_play.call_deferred()`. No subclass overrides `_ready`, and no caller reads state that `_play` creates right after `spawn()`.\n     - Either way, visually check the 8 VFX that have `_process` / `_draw` (VoidBolt, RitualProjectile, SummonSigil, …).\n   - **Limit the 5 polling loops** with a timer that pauses with the game, and `push_warning` when one expires. Delete the unused loop at :511-514.\n   - **Fail loudly** (warning plus early return, never an await) when a VFX can't spawn.\n   - **Backfill missing impacts on abort.** Emit any `impact_hit`s not yet fired, then `finished`.\n     - Count emissions in BaseVfx, not VfxSequence. VfxSequence counts only RESERVED beats (:160-162), while VoidScreech (:76-77) and PackFrenzy (:231) emit `impact_hit` directly, so a VfxSequence-level backfill would double-emit.\n     - `impact_count` defaults to 1, and many VFX don't set it.\n   - **Hygiene:** emit `finished` in VoidBoltProjectile :299 and RitualProjectile :303-306.\n3. **Presenter deadline** around each `_play(ev)`.\n   - **Racing helper.** GDScript can't await two signals, and no helper exists yet. Write a small one-shot RefCounted that races the signal against a timer; use `.unbind(n)` for signals that carry arguments.\n   - **Budget per event kind**, default about 8 s. Reference durations at scale 1: ritual sacrifice about 6 s (1.75 s timer + RitualFiring 3.4 s + about 0.85 s tail), a champion summon about 3.9 s.\n   - **Scaling:** `max(base, base * BaseVfx.time_scale)`, never below scale 1, because many waits ignore time_scale (cast preview about 1.1 s, bolt 0.8 s, reveal 1.34 s).\n   - **Pause-aware timer:** `get_tree().create_timer(t, false)`. The default keeps counting while the EscMenu pause is on (EscMenu.gd:40). Don't use wall-clock time: Parity runs at `Engine.time_scale = 10`. Fix `_cast_anim`'s deadline the same way.\n   - **Generation guard.** A timed-out `_play` can't be cancelled, and it resumes if its signal fires late. Bump a generation counter on timeout, and make every continuation after an await in `_play_*` stop if it changed. Without this:\n     - a late `on_impact` in `_play_spell` calls `play_captured_all()` on the member `_spell_pending` (:474-480, :485-489), showing or stealing the *next* spell's events;\n     - a late `_play_damage`, `show_minion` or `animate_hp_change` rewinds labels (the task-046 bug class);\n     - a late `clear_highlight()` wipes the player's selection.\n   - **Resync after a timeout:**\n     - clear `freeze_visuals` (`_play_summon` :319 / :324, bridge :48) and `hold_stats`;\n     - reset `_active_buff_vfx_count`;\n     - refresh the slots and re-apply the view.\n   - **On timeout:** `push_warning` with the event kind and seq, and increment a `timeouts` counter (or emit `timed_out(ev)`).\n4. **Gate.** The step 1 fight asserts `presenter.timeouts == 0`; a `push_warning` alone never fails run_checks, which greps for `SCRIPT ERROR`. Test the deadline itself with a test-only VFX event that never finishes. SummonSigil with a bad slot won't hang once step 2 lands.\n5. **Lint L10** caps `await get_tree().create_timer` in `combat/effects/*VFX.gd` at a baseline of 20 (lint_engine.py:110). Put the new timers in the helper or the presenter, not in `*VFX.gd` files.\n\n## Verification\n\n- The full animated fight passes with zero presenter timeouts.\n- The never-finishing test VFX: the presenter times out once, warns, resyncs and drains to idle, and the player can act afterwards.\n- Pausing with ESC during a long animation doesn't trigger a timeout.\n- `tools/run_checks.sh` green, including the new run.\n\n## Related\n\n- Roadmap E (presentation reads only the journal) and F (look-ahead matched by cause) come after this.\n\n## Work log\n\n- 2026-09-25: opened from the architecture review. Verified `_drain` has no timeout, `BaseVfx._ready → _play()` is synchronous, and `summon_spark_with_sigil` awaits `finished` after `spawn()`.\n- 2026-09-30: re-verified at `3009a60` and rewritten.\n  - Priority high → normal: no hang is reachable today.\n  - Path 1 is latent, because callers validate first.\n  - Dropped the \"watchdog in release\" step.\n  - VoidBolt :299 is not a hang.\n  - Await count corrected to 38 plus 5 polling loops (was \"about 31\"). Added the trap-reveal and detonation polls and the silent spawn skip.\n  - LiveSmoke already covers four animated scenarios.\n  - The deadline now needs a generation guard, a pause-aware timer, budgets of at least 6 s, a resync and a zero-timeout assertion."}, {"id": "\"049\"", "title": "Break CombatState reference cycles so each fight is freed", "status": "backlog", "area": "combat", "priority": "high", "started": "", "finished": "", "file": "049-combatstate-refcount-cycles.md", "body": "## Description\n\nFound in the 2026-09-25 architecture review (issue 3 of 9). Re-verified 2026-09-30 at `3009a60`. Line numbers are from that commit.\n\nHow Godot 4 frees RefCounted objects:\n- By reference count only; there is no cycle collector.\n- A typed field holding an object is a strong reference.\n- A lambda keeps its captured locals alive, and keeps `self` alive if it uses it.\n- Plain method callables (`h.on_x`, `Callable(obj, \"m\")`, `.bind(...)`) hold only an ObjectID, so they form no cycle.\n\n### Cycles through `CombatState`\n\n| Holder → state | Where |\n|---|---|\n| `combat_manager` (CombatManager) | Created at CombatState.gd:2349; back-ref assigned directly at :2350; field at CombatManager.gd:54 |\n| `_hardcoded` (HardcodedEffects) | Created at :2354, `setup(self)` at :2355; field at HardcodedEffects.gd:19 |\n| `_handlers` (CombatHandlers) | Created at CombatSetup.gd:524; field at CombatHandlers.gd:14 |\n| `relic_effects` (RelicEffects) | Created lazily in `_cmd_activate_relic` (:2827, :2853) when a relic other than `relic_execute` is used; field at RelicEffects.gd:8 |\n| Trigger lambdas capturing `h` / `self` | CombatSetup.gd:630, :632; CombatState.gd:376, :788, :805 |\n| The same lambdas in `_env_ritual_handlers` (:1620) and `_rune_aura_handlers` (:1625) | So `trigger_manager.clear()` alone doesn't break them |\n| **CombatSim lambdas, in every sim fight** | In `_build`: `growth_hooks[\"player\"/\"enemy\"]` capture `state` and the profiles (→ agent → `StateAgent._state`) (CombatSim.gd:81-84). `enemy_profile_changed` connects to a lambda capturing `e_agent` and `enemy` (:76). With a snapshot callback, `run` adds a `turn_ended` lambda capturing `state` (:216). |\n| `diagnostics` ↔ `CombatDiagnostics._state` | CombatState :1972, CombatDiagnostics.gd:17. Only with `dmg_log` / `debug` (DebugSingleSim, VoidboltDmgDebug); BalanceSimBatch doesn't attach diagnostics. |\n| Test lambdas | `growth_hooks` (ParityTests.gd:131, LiveSmokeTests.gd:213); `command_recorded` (ParityTests :100-103, :121). CommandTests and DamageTypeTests register lambdas on the trigger manager. |\n\nThese are **not** cycles:\n- MinionInstance (its `state` field is an enum), SlotState, HeroState, CardInstance, CombatEvent payloads, RelicRuntime, ViewState;\n- EnemyTurnRunner (owned by a Node), and the scene's Nodes and their lambdas;\n- `journal`, `command_log` and the boards. They hold no reference back to the state, so they are freed with it once the cycles are broken.\n\n### teardown() and the drivers\n\n`teardown()` (:2391-2397) only disconnects from the `BuffSystem` bus and resets the two `MinionInstance` statics. It nulls nothing. So every CombatState leaks, along with its journal, boards and decks, and BalanceSimBatch runs thousands of fights.\n\nThe drivers already call `teardown()`:\n- `CombatSim.replay` (:111)\n- `CombatScene._exit_tree` (:771-772)\n- `CombatSim.run` (:298), but **before** it builds its result: :299-350 still read `player_board`, `_vw_*`, `diagnostics.dmg_log` and `relic_runtime`. That's harmless today and breaks once teardown nulls things.\n\n### Tests\n\n- There are 218 `build_state(` call sites. TriggerHandlerTests (187) and CommandTests (30) call `teardown()`. CardEffectTests calls it once (:448), and DamageTypeTests never does.\n- **Bus cross-talk.** A state that skips teardown stays connected to the `BuffSystem` bus. Every later `corruption_removed` reaches `_on_corruption_removed_bus` (:2374) on each stale state, which fires its own trigger manager with a foreign minion.\n- **The statics** don't carry over between tests: `CombatSetup.gd:609-610` sets them on every build. The real hazard is that tearing down one state resets the flags of any other state that is still alive.\n\n## Proposed fix\n\n1. **Rewrite `teardown()`** so it is idempotent, with null guards everywhere (tests already call it, and auto-teardown would call it again). It should:\n   - disconnect the bus and reset the statics, as it does now;\n   - null each helper's `state`, and the state's `combat_manager`, `_hardcoded`, `_handlers` and `relic_effects`;\n   - call `trigger_manager.clear()`, and clear `_env_ritual_handlers`, `_rune_aura_handlers` and `growth_hooks`;\n   - null `diagnostics._state` and `diagnostics`;\n   - disconnect every connection on the state's own signals (loop `get_signal_list()` → `get_signal_connection_list()`), which drops the CombatSim and test lambdas.\n\n   **Don't** clear `journal`, `command_log` or the boards. It isn't needed, and ParityTests.gd:160 reads `eng_state[0].journal` after `sim.run` has torn down.\n2. **`CombatSim.run`:** build the result into a local `out`, then call `teardown()`, then return `out`.\n3. **TestHarness auto-teardown.**\n   - Track every state `build_state` creates.\n   - Tear them down at the end of each test, never lazily at the next `begin_test`: doing it later would reset the statics the new state has just set.\n   - Some tests build states after `begin_test(label, null)` (CardEffectTests.gd:436), so tracking can't rely on `begin_test`.\n4. **Optional: weakref back-refs** through a property getter: `var state: CombatState: get: return _state_ref.get_ref()`, plus a setter so `combat_manager.state = self` keeps working. This needs no call-site changes. But it covers only the four helpers, not the lambdas in containers, and adds a `get_ref()` on the hottest sim path. Treat it as extra insurance, not a replacement for step 1.\n5. **Docs:** ARCHITECTURE.md:74 says `teardown()` only drops the bus subscription.\n\n## Verification\n\n- **Leak probe** (TestHarness layer):\n  - Build a state that exercises every cycle: place a rune, play an environment with rituals, take a grand-ritual talent, activate a non-execute relic.\n  - Take `weakref()` of the state, `_handlers`, `combat_manager`, `_hardcoded` and `trigger_manager`.\n  - Call `teardown()`, drop the local, and assert every `get_ref() == null`. RefCounted objects free immediately, so no frame wait is needed.\n  - Don't pass the state to `begin_test`: `TestHarness._current_state` (static, :25) would keep it alive.\n- **Sim probe:** a `state_observer` that stores only `weakref(st)`. After `await sim.run(...)` it resolves to null. This covers the `_build` lambdas.\n- **BalanceSimBatch memory stays flat** across a matrix run. Measure with `OS.get_static_memory_usage()`, or with `Performance.OBJECT_COUNT` and a tolerance after warm-up. OBJECT_COUNT is noisy because `CardDatabase.clear_override_cache()` runs on every setup.\n- `tools/run_checks.sh` green; Parity digests unchanged.\n\n## Related\n\n- Roadmap I (engine robustness) and J (test isolation) build on this.\n- Roadmap G's \"should the AI look ahead\" decision lists 049 as a prerequisite.\n\n## Work log\n\n- 2026-09-25: opened from the architecture review. Verified all four back-refs and that `teardown()` doesn't clear them.\n- 2026-09-30: re-verified at `3009a60` and rewritten.\n  - Added the cycles the first version missed: the CombatSim, test and diagnostics lambdas, and the handler arrays. The four-helper fix alone would still leak every sim fight.\n  - The drivers already call teardown, but `CombatSim.run` calls it before building its result.\n  - Dropped clearing `journal` / `command_log`.\n  - Corrected the test counts and the claim about the statics.\n  - Weakref demoted to optional."}, {"id": "\"050\"", "title": "Route trap / environment removal through one engine API (F15 leak, unjournaled destroy, owner lookup)", "status": "backlog", "area": "combat", "priority": "high", "started": "", "finished": "", "file": "050-effectresolver-side-bugs.md", "body": "## Description\n\nFound in the 2026-09-25 architecture review (issue 4 of 9). Re-verified 2026-09-30 at `3009a60`. Line numbers are from that commit.\n\nThis breaks invariant #3 (symmetric effects) and the journal rule (the screen shows only what's journaled).\n\nRemoving a trap or an environment is copied inline instead of going through one API:\n- **8 trap sites:** EffectResolver :420-424 and :608-612; CombatState `_fire_ritual` :885-889, `_korrath_place_random_rune` :1896-1897 and `_fire_traps_for` :1050-1051; CombatHandlers Grand Ritual Chaos :330-333 and enemy ritual sacrifice :1262-1266; PhaseTransition :92-93.\n- **3 environment sites:** EffectResolver :410-414 and :613-616; PhaseTransition :90-91.\n\nDoing a removal correctly takes four things:\n1. remove it from the side's array or field;\n2. remove the rune aura, or run the environment's `on_replace_effect_steps`;\n3. unregister rituals (player side only);\n4. journal the change.\n\nMost copies skip at least one.\n\n### Reachable today\n\n1. **The F15 phase change leaks rune and ritual handlers.**\n   - `PhaseTransition._clear_combat_state` (:88-93) nulls both environments and clears both trap arrays directly.\n   - It doesn't call `_remove_rune_aura` or `_unregister_env_rituals`, and journals neither TRAPS_CHANGED nor ENVIRONMENT_CHANGED.\n   - Rune closures don't check that the rune is still on the board (CombatState.gd:788-795), so the player's Void / Blood / Dominion rune effects keep firing in phase 2.\n   - `on_env_ritual` (CombatHandlers.gd:693) doesn't check for an environment, so rituals can still fire.\n   - The presenter's PHASE_TRANSITION playback (CombatPresenter.gd:240) only refreshes the enemy hero panel, so the live trap and environment panels go stale.\n2. **Destroying an environment isn't journaled.**\n   - Cyclone and Hurricane call `_update_environment_display()`, which only emits the `environment_changed` signal, and nothing connects to that signal.\n   - The environment panel updates only on the ENVIRONMENT_CHANGED journal event (CombatPresenter :708).\n   - So the live screen keeps showing the destroyed environment.\n3. **Destroy skips the environment's removal steps.** Neither EffectResolver branch calls `_unregister_env_aura` (:384), which runs `on_replace_effect_steps`. Dark Covenant's `dark_covenant_remove` (CardDatabase.gd:1910) therefore never runs, and its buffs stay on minions for the rest of the fight.\n4. **The owner is found by object identity.**\n   - Traps and environments are shared CardData objects: `get_card_for_combat` returns the base object when no override applies.\n   - The trap DESTROY branch (:602-612) checks `target in traps_of(ctx.owner)` first. So if the player Cyclones the enemy's rune while holding the same rune, the player's own copy is destroyed.\n   - `_encode_target` (CombatState.gd:3131-3137) has the same ambiguity.\n   - Enemy runes exist in f2_c, f4_b and f5_a (dominion, blood, shadow). This is reachable whenever the player holds the same rune id. Confirm it with the probe below.\n5. **Possible stale trap panel:**\n   - Grand Ritual Chaos emits the `traps_changed` signal instead of journaling (CombatHandlers:333).\n   - `_korrath_place_random_rune` journals no TRAPS_CHANGED.\n\n   Confirm whether the panel goes stale.\n\n### Latent (no enemy content owns an environment or a Flesh Rune today)\n\n- The DESTROY environment branch (:613-616) clears the player's environment, whoever was targeted.\n- The ACTIVE_ENVIRONMENT step (:408-414), used only by Hurricane (CardDatabase.gd:1894), clears only `active_environment`. Hurricane's text is \"Destroy all Traps and the active Environment on the battlefield, including your own\". ALL_TRAPS already covers both sides; the environment step should too.\n- The SOURCE_RUNE step (:415-425, Flesh Rune upkeep failure) checks only `active_traps`. `ctx.owner` is already the rune's owner (`_apply_rune_aura` builds the ctx with it, :788-793), so the fix is `traps_of(ctx.owner)`.\n- `_unregister_env_rituals()` (:389) clears one global array. Rituals are player-only (`cmd_play_environment` :2736-2743), so any per-side API must call it only for the player side.\n\n### What already exists\n\n- `traps_of(side)`, `environment_of(side)` and `set_environment(side, env)` (CombatState.gd:1422-1430).\n- `set_environment` journals ENVIRONMENT_CHANGED but doesn't unregister rituals or run on_replace steps.\n- Missing: `remove_trap`, `destroy_environment`, `place_trap`.\n\n## Proposed fix\n\n1. **Engine API on CombatState:**\n   - `remove_trap(side, t)`: erase it, call `_remove_rune_aura` if it is a rune, and journal TRAPS_CHANGED.\n   - `destroy_environment(side)`: run `_unregister_env_aura` (the on_replace steps), call `_unregister_env_rituals()` if `side == \"player\"`, then `set_environment(side, null)`, which journals.\n   - Optional `place_trap(side, t)`: placement is copied in `cmd_play_trap`, RelicEffects :120-138 and Korrath.\n2. **Targets carry their side.** A chosen trap or environment target becomes a (side, slot) pair, or a ctx field set by the input handler, the AI and `_encode_target`. DESTROY reads it instead of testing `in traps_of(...)`.\n3. **Route every site listed above through the API.**\n   - SOURCE_RUNE uses `ctx.owner`.\n   - ACTIVE_ENVIRONMENT (Hurricane) clears both sides.\n4. **PhaseTransition** goes through the API, but keeps the current order: the boards are wiped before the clear, so `_remove_rune_aura` grants no Korrath runic_absorption stacks. Alternatively, add a \"banish\" flag that skips on-remove rewards.\n5. **Lint L13** (051 takes L12): no `active_traps` / `enemy_active_traps` `.erase` / `.clear` / `.remove_at`, and no `active_environment =` / `enemy_active_environment =`, outside CombatState's API.\n   - Exempt `debug/tests`, which seeds these fields (CommandTests:392, CardEffectTests:259, TriggerHandlerTests:2901-2932).\n   - The rule can't see local aliases (`live_traps.remove_at`, `traps.erase`), so route those sites by hand.\n\n## Verification\n\nNew probes in CardEffectTests / TriggerHandlerTests. None exist today for Cyclone, Hurricane, Void Wind, Dark Covenant, Flesh Rune or PhaseTransition.\n- The player Cyclones their own environment: the journal has ENVIRONMENT_CHANGED with `env = null`, and the Dark Covenant buffs are removed.\n- The player Cyclones the enemy's rune while holding the same rune: the enemy's copy is the one destroyed.\n- Hurricane clears both sides' traps and environments.\n- An enemy-owned Flesh Rune fails its upkeep and removes itself. Set it up by seeding the fields and calling `_apply_rune_aura(r, \"enemy\")`.\n- F15:\n  - Setup: set `enemy_profile_id = \"abyss_sovereign\"` and `_sovereign_phase = 1`, then call `PhaseTransition.attempt(state)`.\n  - Expect: `_rune_aura_handlers` and `_env_ritual_handlers` are empty, and TRAPS_CHANGED / ENVIRONMENT_CHANGED are journaled.\n- `tools/run_checks.sh` green.\n- Balance: Acts 1–2 should be unchanged. F15 may shift, because player runes stop firing in phase 2. Record the shift.\n\n## Related\n\n- Roadmap A2 (`SideState`) extends this API.\n- Roadmap Q3 (accept balance shifts when enemy-side triggers start firing).\n\n## Work log\n\n- 2026-09-25: opened from the architecture review. Verified :410-425 and :612-616 read and write the player-side fields.\n- 2026-09-30: re-verified at `3009a60`, rewritten and retitled.\n  - The three originally listed bugs are latent: no enemy content owns an environment or a Flesh Rune.\n  - Added the reachable ones: the F15 rune/ritual leak, unjournaled environment destroy, skipped Dark Covenant removal, and owner lookup by shared object.\n  - `environment_of` / `set_environment` already exist; the task now extends them.\n  - Hurricane clears both sides.\n  - Site count corrected to 8 trap and 3 environment sites (was \"about 6\").\n  - The lint rule is L13, not an L8 extension."}, {"id": "\"051\"", "title": "Stop AI profiles writing CombatState outside cmd_* (and de-duplicate spark cost)", "status": "backlog", "area": "combat", "priority": "normal", "started": "", "finished": "", "file": "051-ai-profiles-no-direct-state-writes.md", "body": "## Description\n\nFound in the 2026-09-25 architecture review (issue 5 of 9). Re-verified 2026-09-30 at `3009a60`. Line numbers are from that commit.\n\nThis breaks invariant #4: both sides act only through `state.cmd_*`, so a fight replays from its `command_log`.\n\n### Direct state writes in `enemies/ai/**` (all 7)\n\n- `RiftStalkerProfile.gd:224` and `:226`: `_rift_collapse_casts`, `_rift_collapse_kills`. This is an enemy profile (F7) and runs in live play too.\n- `SpellBurnPlayerProfile.gd`:\n  - `:381`: `_void_imp_dmg = prev + 100`;\n  - `:405-416`: `_void_bolt_spell_casts`, `_abyssal_plague_fires`, `_abyssal_plague_kills` and `_pending_dmg_source = \"void_bolt_spell\"`.\n\n  This is a player-side **sim** bot (ProfileRegistry player table :44). It is used by BalanceSimBatch, BalanceSim, ScoredAITest, VoidboltDmgDebug, ScenarioTests S25 and Parity F2, never by the live player.\n\n### Other mutation outside cmd_*\n\n- **`DefaultProfile.gd:14` does `agent.hand.sort_custom(...)`, which sorts the engine's own hand.** This is the real replay hazard.\n  - `agent.hand` is `state.hand_of(side)` by reference (CombatAgent.gd:37 → StateAgent.gd:29).\n  - `_log_command` records `hand_index = hand_of(side).find(inst)` (CombatState.gd:3116) in sorted order.\n  - `CombatSim.replay` refuses with `replay_hand_mismatch` when `hand[hand_index]` doesn't match (CombatSim.gd:128-133), and replay's hand was never sorted.\n  - So replaying a fight with a \"default\"-profile side should fail. Traced in the code, not run.\n  - \"default\" is CombatSim.run's default enemy profile and `ProfileRegistry.make`'s fallback for unknown ids.\n  - Live and Parity don't see it, because both run the profile.\n- **`CombatAgent.mana` / `essence` setters** (CombatAgent.gd:41-48 → StateAgent `set_mana` / `set_essence`): a write path with no callers.\n\n### Why the counter writes matter less than first stated\n\n- **`_pending_dmg_source` only sets a label.**\n  - It feeds `base_source` in the Void Bolt functions (CombatState.gd:967-997) and `src_label` in hero damage (:2041-2047).\n  - From there it reaches DamageInfo's `source_card`, the `damage_dealt` signal (CombatDiagnostics) and the DAMAGE_DEALT payload. No rule, handler or presenter reads `source_card`.\n  - It is also redundant: the Void Bolt spell path (EffectResolver:158) already defaults the label to `\"void_bolt_spell\"`.\n- **Replay can't observe the counters.** `CombatSim.replay` (:92-112) applies only the command log, so the counters stay 0 on replay. But replay returns only the winner and digest, and `digest_text` (CombatState.gd:2242+) excludes both counters and labels. Parity F2 is green for the same reason.\n- **They still violate the rules boundary,** and the counter values reflect what the AI did, not what happened in the fight.\n\n### Lint\n\n- L2 (RNG) and L9 (duck typing) already scan `enemies/ai`, but no rule covers state writes there.\n- L8's regex `\\bstate\\.\\w+\\s*=[^=]` misses `+=`, so don't copy it.\n- L9 misses `agent.state.get(field)` with a variable key (VoidHeraldProfile.gd:349-351, `_scene_has`).\n\n### Who reads the counters\n\n`CombatSim.run`'s result (:332-346) → `run_many` averages (:469-478, :537-546) → BalanceSimBatch :377-386 and SimRunner :82-83. CombatDiagnostics isn't attached in batch runs (`run_many` passes false/false, :437), so it can't own the counters.\n\n### Spark cost\n\n`CombatProfile._effective_spark_cost` (:949-971) copies `CombatState.spark_cost_of` (:2987-3003), and the text has drifted:\n- it reads `enemy_passives` whatever `agent.side` is, while the engine returns the base cost for any non-enemy side;\n- it also requires `_champion_vh_summoned`.\n\nIn practice it doesn't drift: all 7 callers are enemy profiles, and the flag is always set when the champion is summoned (CombatHandlers.gd:2273). So the replacement should leave balance unchanged.\n\n## Proposed fix\n\n1. **Count in the engine.** Count where the spell resolves, like the existing `_vw_behemoth_plays`, and delete the profile writes.\n\n   This changes what the counters mean:\n   - rift_collapse is also in the f9, f10, f12 and f13 decks under other profiles;\n   - void_bolt is cast by other player profiles;\n   - `_void_imp_dmg` is currently a hardcoded +100 per play.\n\n   Engine counting will give those rows values they didn't have before.\n2. **Delete the `_pending_dmg_source` write.**\n3. **`DefaultProfile`:** sort `agent.hand.duplicate()`. Consider making `CombatAgent.hand` return a copy; check first for callers that rely on identity.\n4. **Delete the unused `mana` / `essence` setters,** or make them assert.\n5. **Spark cost from the engine.** Add `StateAgent.effective_spark_cost(card)` → `state.spark_cost_of(...)` in StateAgent's \"Costs — the engine's own numbers\" section (:97-105), with a base in CombatAgent. Delete `_effective_spark_cost`.\n6. **Lint L12** for `enemies/ai/**`:\n   - no assignment (`=`, `+=`, `-=`, …) through `agent.state.` / `state.`;\n   - no in-place mutation of `agent.hand` or the boards (`sort_custom`, `append`, `erase`, `clear`, `remove_at`);\n   - no `agent.mana =` / `agent.essence =`.\n\n   Banning `state._private` reads would hit about 42 sites; leave that as a follow-up (roadmap G4).\n7. **Optional, while touching this code:** the dmg-log `__logged__` sentinel is dead, because `source_card` is never empty. As a result `_capture_damage` logs Void Bolt again after the split log at CombatState.gd:972-977.\n\n## Verification\n\n- **Replay probe:** `CombatSim.run` a fight with a \"default\" enemy, then `CombatSim.replay` its command log. The winner and digest must match. This should fail before step 3.\n- **BalanceSimBatch counters:** the spell_burn and rift_stalker rows match before and after. Other rows may gain values; that's expected from step 1.\n- **Win rates:** byte-identical, since the spark-cost change should be neutral. Record any shift in the task summary.\n- `tools/run_checks.sh` green, including L12.\n\n## Related\n\n- Roadmap G (AI consolidation): profiles read through `CombatAgent` only.\n\n## Work log\n\n- 2026-09-25: opened from the architecture review. Verified the writes at RiftStalkerProfile :224/:226 and SpellBurnPlayerProfile :405-416.\n- 2026-09-30: re-verified at `3009a60` and rewritten.\n  - Added the missed `_void_imp_dmg` write and the DefaultProfile in-place hand sort (the real replay hazard).\n  - `_pending_dmg_source` is label-only and redundant.\n  - The counters aren't in the digest, so replay doesn't visibly diverge.\n  - Corrected \"no lint covers enemies/ai\".\n  - The counters go into the engine, not CombatDiagnostics, and the before/after check is relaxed.\n  - The spark-cost change is expected to be balance-neutral."}, {"id": "\"052\"", "title": "Make saves versioned, atomic and complete", "status": "backlog", "area": "meta", "priority": "high", "started": "", "finished": "", "file": "052-save-robustness.md", "body": "## Description\n\nFound in the 2026-09-25 architecture review (issue 6 of 9). Re-verified 2026-09-30 at `3009a60`. Line numbers are from that commit.\n\nThere are three unversioned JSON persisters:\n- `shared/scripts/UserProfile.gd` (`user://profile.json`);\n- `shared/scripts/SavedDecks.gd` (`user://saved_decks.json`);\n- EncounterDecks, which moves into the repo in task 047.\n\n### UserProfile\n\n1. **No version field.** `save()` (:18-44) writes `{\"permanent_unlocks\", \"run\": {...}}`.\n2. **Not atomic.** It opens with `FileAccess.open(SAVE_PATH, WRITE)` and then calls `store_string` (:39-44). A crash mid-write leaves a truncated file.\n3. **A corrupt file loses every unlock.**\n   - `load_profile()` reaches `push_error; return false` (:61-63) before `_ensure_default_unlocks()` (:68), so `permanent_unlocks` stays empty.\n   - `has_active_run()` also fails to parse (:98-99), which disables Continue.\n   - \"New Run\" calls `clear_run()`, which saves immediately (MainMenu.gd:67, UserProfile.gd:102-104) and overwrites the file.\n   - Other auto-saves: `GameManager.go_to_scene()` (:69-71) and `EncounterLoadingScene.gd:252`.\n4. **The run state is incomplete.** These aren't saved:\n   - `void_shards` (GameManager.gd:23; earned at CombatScene.gd:1597, spent in ShopScene);\n   - `relic_bonus_charges` (GameManager.gd:45; written at RelicRewardScene.gd:154);\n   - `current_deck_id`. Load re-rolls the enemy deck (UserProfile.gd:85).\n   - The combat seed. A reload reshuffles the fight; whether that matters (save-scumming) is a design call.\n5. **Unknown card ids are never cleaned.** `CardDatabase.get_card_for_combat` calls `push_error` (:91-94) and `setup_deck` skips the null (CombatState.gd:1547-1550), but the id stays in the save forever. Shop, DeckViewer and DeckBuilder also hit `get_card` with it.\n6. **`reset_all()` (:108-121) misses fields:** `void_shards`, `relic_bonus_charges`, `player_hp(_max)`, `core_unit_limit`, `has_revive`. `current_faction` is written (HeroSelectScene.gd:467) but never read.\n7. **`player_hp` is saved but never used.**\n   - Combat reads `player_hp_max` (CombatConfig.gd:45).\n   - The only writers are ShopScene.gd:320-321 and the revive (CombatScene.gd:1663), and nothing writes HP back after a fight.\n   - The design docs claimed HP persists between fights. They were corrected on 2026-09-30 (see Decision).\n\n### SavedDecks is worse\n\nOn a parse error `load_all()` returns `{}` (:17-18). `save_deck()` (:32-35) then rewrites the file with only the new deck, and every saved deck is lost.\n\n### Tests\n\n- `SAVE_PATH` is a `const`, so tests can't point it at a temp file.\n- RunAllTests has 5 layers (DamageType, CardEffect, TriggerHandler, Command, Scenario; RunAllTests.gd:11-31) and no meta layer.\n- Only LiveSmoke (:19) and Parity (:60) set `saving_disabled`.\n\n## Decision (owner, 2026-09-30)\n\n- **HP does not carry between fights.** Every fight starts at full `player_hp_max`, which is what the code has done since v0.34 replaced the shop's HP Restoration with Second Wind.\n  - The docs were updated on 2026-09-30: DESIGN_DOCUMENT.md §17 run state, ARCHITECTURE.md's GameManager row, and REWARD_SYSTEM_DESIGN.md's service tables.\n  - This task deletes the `player_hp` field.\n\n## Proposed fix\n\n1. **Shared persistence helper** (e.g. `shared/scripts/JsonStore.gd`), used by UserProfile and SavedDecks:\n   - **Atomic write:** write `<path>.tmp`, then `DirAccess.rename_absolute` over the real file, through `ProjectSettings.globalize_path` as `reset_all` does (:121). Keep `<path>.bak`. Check that the rename replaces an existing file on Windows as well.\n   - **Versioning:** a top-level `\"version\"`. A file with no version is v1. Migrate through a chain (`_migrate_v1_to_v2`, …).\n   - **Parse failure:** try `.bak`. Otherwise rename the file to `*.corrupt.json`, start from defaults, and don't write over it until a save succeeds.\n2. **UserProfile:**\n   - Always run `_ensure_default_unlocks()`, including on failure.\n   - Route the saves in GameManager and EncounterLoadingScene through the helper.\n3. **SavedDecks** (the most urgent part): never treat a parse failure as an empty file when saving.\n4. **`RunState`** with `to_dict` / `from_dict` / `reset`, owning every run field. GameManager holds one.\n   - It includes `void_shards`, `relic_bonus_charges`, `current_deck_id` and 047's `run_seed`.\n   - Cast numbers to int in `from_dict`, because JSON loads them as floats (see CombatConfig.gd:88-89).\n   - `reset()` covers the fields `reset_all()` misses.\n   - Drop `current_faction`, or read it.\n5. **Enemy on load.**\n   - Rebuild it from the saved `current_deck_id` with `get_deck`, `get_deck_profile` and `get_deck_limited`.\n   - If the id no longer exists, pick again with the run seed.\n   - Saving the id, not only the seed, survives pool edits between versions.\n6. **Validate ids on load:** drop unknown card, relic and talent ids with a warning, and write the cleaned save back.\n7. **Make `SAVE_PATH` overridable** (a var or a setter) so tests can use a temp path.\n8. **Delete `player_hp`** (see Decision):\n   - remove it from GameManager (`:25`, including its \"persists between fights\" comment), `reset_all`, the save dict and `load_profile`;\n   - remove the writes in ShopScene.gd:320-321 (Max HP Increase keeps raising `player_hp_max`) and CombatScene.gd:1663 (the revive restart);\n   - the v1 → v2 migration drops the key.\n\n## Verification\n\n- New MetaTests layer in RunAllTests, with a temp save path:\n  - round-trip save/load equals the run, including shards, relic charges and deck id;\n  - a corrupt profile keeps the default unlocks and is preserved as `.corrupt.json`;\n  - a corrupt saved_decks file isn't wiped by the next `save_deck`;\n  - an unknown card id is dropped with a warning;\n  - a v1 fixture migrates. Use this machine's current `profile.json`: no version, `permanent_unlocks` with 31 entries, `run: null`.\n- Manual: quit mid-run and reload. Shards and the enemy deck are unchanged.\n- `tools/run_checks.sh` green. CLAUDE.md says \"4 layers\"; update it to 6.\n\n## Related\n\n- Do after 047, which adds the run seed and the deck-pick scheme.\n- Pairs with roadmap H1 (`RunService`).\n\n## Work log\n\n- 2026-09-25: opened from the architecture review. Verified that the save dict lacks `void_shards` and that the corrupt path returns before `_ensure_default_unlocks`.\n- 2026-09-30: re-verified at `3009a60` and rewritten.\n  - `player_hp` is now an open owner decision: the design doc says HP persists, the code doesn't.\n  - Added the SavedDecks wipe-on-parse-error bug, the immediate New Run save, the missed `reset_all` fields, the float casts and the const `SAVE_PATH`.\n  - The deck id is saved alongside 047's run seed.\n- 2026-09-30: owner decision: no HP carry-over. The design docs are updated; step 8 deletes `player_hp`."}, {"id": "\"053\"", "title": "Gate the cheat panel and test config out of release builds", "status": "backlog", "area": "meta", "priority": "high", "started": "", "finished": "", "file": "053-gate-debug-tools-in-release.md", "body": "## Description\n\nFound in the 2026-09-25 architecture review (issue 7 of 9). Re-verified 2026-09-30 at `3009a60`. Line numbers are from that commit.\n\nDebug tooling ships in every build.\n\n### The cheat panel\n\n- `CombatScene.gd:231-233` always creates `CheatPanel`.\n- `CombatInputHandler.gd:468`: F12, or a bare **C** when not typing, toggles it. `:470` reads `_scene._cheat.visible` on every ESC press.\n- Its actions go beyond the current fight:\n  - **Fight:** Dmg Player / Dmg Enemy (CheatPanel.gd:137-149) and Kill Enemy (:151-156), all through `combat_manager.apply_hero_damage`, outside the commands. Also heal (:160-170), refill resources (:173-178) and add card (:279-292).\n  - **Run and save:**\n    - unlock talent (:302-322) writes `GameManager.add_talent_point / unlock_talent` and re-runs `CombatSetup.setup`;\n    - grant relic (:333-348) writes `GameManager.player_relics`;\n    - switch enemy (:368-376) writes `current_enemy` / `run_node_index` and calls `go_to_scene`, which auto-saves.\n\nSo in a release build, one key press gives the player an instant win and permanent edits to the save. The panel's damage also bypasses `command_log`, so those fights don't replay.\n\n### TestConfig and the debug launch path\n\n- **The `TestConfig` autoload** (project.godot:27) always loads.\n- **`CombatScene._apply_test_config`** (:1031-1095) writes state directly, but only `if TestConfig.enabled` (:234).\n  - Only `TestConfig.launch()` sets `enabled` (debug/TestConfig.gd:87-88), and only TestLaunchScene calls it (:203).\n  - So it does nothing in normal play.\n- **The `start_new_run` fallback:** `CombatScene._ready` silently calls `GameManager.start_new_run` (:181-182) when there's no active run. It is reachable only by launching the scene directly (F6), because loading a save sets `run_active` (UserProfile.gd:73).\n\n### Exports and references to debug/\n\n- **No export preset.** There is no `export_presets.cfg`, and `.gitignore:4-5` ignores it on purpose (\"contains paths, not source\").\n- **References to `debug/`:** non-debug code reaches it only through the autoload line and the `TestConfig.*` reads in CombatScene (:234, :1033-1095). There is no `preload` or `load` of `res://debug`, and no debug `class_name` is used outside `debug/`.\n- **Existing patterns:** `OS.is_debug_build()` is used once (VfxSequence.gd:203), and there is no dev-tools project setting. CheatPanel is already exempt from L8 (lint_engine.py:290).\n\n## Decision (owner, 2026-09-30)\n\n- **Commit `export_presets.cfg`.** Remove its line from `.gitignore` (:4-5), so the `debug/*` exclude is versioned and every machine gets it.\n  - Godot 4 keeps export credentials in `.godot/export_credentials.cfg`, which is already ignored. Still, read the preset before its first commit and make sure it holds no secrets or machine-specific absolute paths.\n  - No export templates are installed on the dev
